<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Tracker de séance de musculation — 100% hors-ligne, données locales.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230b0b0e'/%3E%3Cg stroke='%23ff4d00' stroke-width='9' stroke-linecap='round' fill='none'%3E%3Cpath d='M30 30v40M70 30v40M17 40v20M83 40v20M30 50h40'/%3E%3C/g%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="preload" href="assets/fonts/inter-var-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/space-grotesk-var-latin.woff2" as="font" type="font/woff2" crossorigin>
<title>Muscu Tracker</title>
<style>
  @font-face{font-family:'InterV';src:url('assets/fonts/inter-var-latin.woff2') format('woff2');font-weight:100 900;font-style:normal;font-display:swap;
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
  @font-face{font-family:'InterV';src:url('assets/fonts/inter-var-latinext.woff2') format('woff2');font-weight:100 900;font-style:normal;font-display:swap;
    unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1D00-1DBF,U+1E00-1E9F,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;}
  @font-face{font-family:'SGV';src:url('assets/fonts/space-grotesk-var-latin.woff2') format('woff2');font-weight:300 700;font-style:normal;font-display:swap;}

  :root{
    /* ---- Design tokens · v3 · blanc premium ---- */
    --bg:#ffffff; --bg2:#f8f7f6; --bg3:#f0efed;
    --ink:#0b0b0e; --ink2:#575551; --mut:#9c9a96;
    --hair:#eceae7; --hair2:#e0deda;
    --acc:#ff4d00; --acc-d:#d93f00; --acc-soft:#fff3ec;
    --ok:#0ca154; --ok-d:#077a3d; --ok-soft:#e9f8f0; --ok-hair:#bfe8d2;
    --amber:#c97b00; --amber-soft:#fcf4e4;
    --red:#e5484d; --red-hair:#f6c8ca;
    --chart-de:#e7e5e2; --grid:#f2f1ef; --baseline:#dedcd8;
    /* muscles — palette catégorielle validée (CVD-safe, ≥3:1 sur blanc) */
    --m-chest:#d64545; --m-back:#2a78d6; --m-delts:#c97b00; --m-rear:#d0549b;
    --m-arms-tri:#7a4fd6; --m-arms-bi:#0f9f8f; --m-legs:#4a9d23; --m-core:#96801f; --m-cuff:#0e9bc0;
    --f-ui:'InterV',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --f-disp:'SGV','InterV',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --nav-h:64px; --r:18px; --r2:12px;
    --sh:0 1px 2px rgba(11,11,14,.04);
    --sh-float:0 18px 44px -12px rgba(11,11,14,.22);
    --safe-b:env(safe-area-inset-bottom,0px);
    --spring:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:var(--f-ui);
    font-size:16px; line-height:1.45;
    padding-bottom:calc(var(--nav-h) + var(--safe-b) + 116px);
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:contain;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 16px;}
  svg.i{display:inline-block;vertical-align:-3px;flex:none;}
  .disp{font-family:var(--f-disp);}
  .micro{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);}

  /* ================= ANIMATIONS ================= */
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px);}}
  @keyframes fadeIn{from{opacity:0;}}
  @keyframes popIn{from{opacity:0;transform:scale(.4);}}
  @keyframes barIn{from{transform:scaleY(0);}}
  @keyframes growX{from{transform:scaleX(0);}}
  @keyframes drawLine{to{stroke-dashoffset:0;}}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.06);}}
  .enter>*{animation:fadeUp .5s var(--spring) backwards;animation-delay:calc(var(--i,0)*50ms);}
  .bgrow{transform-box:fill-box;transform-origin:50% 100%;animation:barIn .6s var(--spring) backwards;animation-delay:var(--d,0s);}
  .vlabel{animation:fadeIn .4s .55s backwards;}
  .ldraw{stroke-dasharray:1;stroke-dashoffset:1;animation:drawLine 1s .15s ease-out forwards;}
  .areafade{animation:fadeIn .6s .7s backwards;}
  .dotpop{animation:popIn .35s var(--spring) backwards;animation-delay:var(--d,0s);}
  .segpop{animation:growX .5s var(--spring) backwards;transform-origin:left center;animation-delay:var(--d,0s);}

  /* ================= HEADER ================= */
  #hdr{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.86);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border-bottom:1px solid var(--hair);padding-top:env(safe-area-inset-top,0px);}
  .hdr-in{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 16px;max-width:560px;margin:0 auto;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{width:32px;height:32px;border-radius:10px;background:var(--ink);display:flex;align-items:center;justify-content:center;color:var(--acc);}
  .brand-name{font-family:var(--f-disp);font-size:16px;font-weight:700;letter-spacing:.01em;}
  .brand-name span{color:var(--mut);font-weight:500;}
  .week-pill{background:var(--bg);border:1px solid var(--hair2);border-radius:999px;
    padding:8px 14px;font-size:11.5px;font-weight:800;letter-spacing:.06em;color:var(--ink2);cursor:pointer;white-space:nowrap;font-family:var(--f-ui);text-transform:uppercase;}
  .week-pill b{color:var(--acc-d);}
  #hdrProg{height:2px;background:transparent;position:relative;}
  #hdrProg .fill{position:absolute;left:0;top:0;bottom:0;background:var(--acc);transition:width .35s var(--spring);}

  /* ================= GENERIC ================= */
  h2{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:28px 2px 10px;display:flex;align-items:center;gap:8px;}
  h2::after{content:"";flex:1;height:1px;background:var(--hair);}
  .card{background:var(--bg);border:1px solid var(--hair);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--sh);}
  .btn{appearance:none;border:none;border-radius:14px;font-weight:700;font-size:15px;cursor:pointer;
    padding:15px 18px;color:var(--ink);background:var(--bg2);transition:transform .1s var(--spring),opacity .15s;font-family:var(--f-ui);
    display:inline-flex;align-items:center;justify-content:center;gap:9px;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--ink);color:#fff;}
  .btn-primary svg{color:var(--acc);}
  .btn-block{display:flex;width:100%;}
  .btn-ghost{background:var(--bg);color:var(--ink);border:1px solid var(--hair2);}
  .btn-danger{background:transparent;color:var(--red);border:1px solid var(--red-hair);}
  .muted{color:var(--ink2);} .small{font-size:13px;} .center{text-align:center;}
  .hidden{display:none!important;}
  a{color:var(--acc-d);}
  .chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--hair2);border-radius:999px;padding:5px 11px;
    font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2);background:var(--bg);}
  .chip-acc{background:var(--acc-soft);border-color:#ffd9c4;color:var(--acc-d);}
  :focus-visible{outline:2px solid var(--acc);outline-offset:2px;}

  /* lien tuto YouTube */
  .chip-yt{padding:4px 10px;font-size:10px;gap:5px;color:var(--ink2);text-decoration:none;margin-left:auto;}
  .chip-yt svg{color:var(--red);}
  .chip-yt:active{transform:scale(.95);background:var(--bg2);}
  .ytmini{display:inline-flex;align-items:center;vertical-align:-3px;margin-left:6px;padding:2px;text-decoration:none;}
  .ytmini svg{color:var(--red);opacity:.8;}

  /* journal des séances (lignes cliquables) */
  .jrow{display:flex;align-items:center;gap:11px;padding:11px 15px;width:100%;
    background:none;border:none;border-bottom:1px solid var(--hair);text-align:left;cursor:pointer;
    font-family:var(--f-ui);color:var(--ink);transition:background .15s;}
  .jrow:last-child{border-bottom:none;}
  .jrow:active{background:var(--bg2);}
  .jchev{color:var(--mut);flex:none;display:flex;}
  .btn-sm{padding:10px 14px;font-size:13px;border-radius:11px;}

  /* poids corporel */
  .bw-top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:2px 4px 10px;}
  .bw-val{font-family:var(--f-disp);font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1;}
  .bw-val small{font-size:14px;color:var(--mut);font-weight:500;}
  .bw-delta{font-size:11.5px;color:var(--ink2);font-weight:600;margin-top:5px;}
  .mini-del{border:none;background:none;color:var(--mut);cursor:pointer;padding:3px 6px;vertical-align:middle;}
  .mini-del:active{color:var(--red);}

  /* détail de séance (modale) */
  .sm-exlist{margin:12px 0 0;border:1px solid var(--hair);border-radius:14px;overflow:hidden;}
  .sm-ex{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border-bottom:1px solid var(--hair);font-size:12px;}
  .sm-ex:last-child{border-bottom:none;}
  .sm-ex .n{font-weight:600;flex:1;min-width:0;}
  .sm-ex .s{color:var(--ink2);font-variant-numeric:tabular-nums;text-align:right;}
  .dur-edit{display:flex;align-items:center;gap:8px;}
  .dur-edit .field{flex:1;max-width:150px;}
  .jdot{width:4px;height:34px;border-radius:3px;flex:none;}
  .jmain{flex:1;min-width:0;}
  .jname{display:block;font-weight:700;font-size:13.5px;letter-spacing:-.01em;}
  .jsub{display:block;font-size:11px;color:var(--mut);font-weight:600;margin-top:1px;text-transform:capitalize;}
  .jright{text-align:right;flex:none;}
  .jright b{display:block;font-family:var(--f-disp);font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;}
  .jright .jsets{font-size:10px;color:var(--mut);font-weight:700;}

  /* ================= HERO ================= */
  .hero{position:relative;background:var(--bg) radial-gradient(150px 150px at 84% 18%,#fff0e7,transparent 72%);
    border:1px solid var(--hair);border-radius:22px;padding:20px 18px 18px;margin-top:14px;box-shadow:var(--sh);
    overflow:hidden;transform-style:preserve-3d;will-change:transform;}
  .hero-3d{position:absolute;top:-6px;right:-14px;width:176px;height:176px;pointer-events:none;}
  .hero-3d canvas{width:100%!important;height:100%!important;filter:drop-shadow(0 22px 12px rgba(11,11,14,.16));}
  .hero-copy{position:relative;padding-right:132px;}
  .hero-num{font-size:58px;font-weight:700;letter-spacing:-.03em;line-height:1;margin:10px 0 6px;}
  .hero-num .pcent{font-size:34px;color:var(--mut);font-weight:500;}
  .hero-sub{font-size:13.5px;color:var(--ink2);}
  .hero-sub b{color:var(--ink);}
  .goalseg{display:flex;align-items:center;gap:6px;margin:16px 0 0;position:relative;}
  .goalseg .seg{flex:1;height:12px;border-radius:999px;background:var(--bg3);overflow:hidden;}
  .goalseg .seg i{display:block;width:100%;height:100%;border-radius:999px;background:var(--acc);}
  .goalseg .lbl{font-family:var(--f-disp);font-size:13px;font-weight:700;color:var(--ink2);margin-left:6px;font-variant-numeric:tabular-nums;}
  .hero-days{position:relative;display:flex;justify-content:space-between;gap:5px;margin-top:16px;}
  .day{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;}
  .day .dot{transition:transform .12s var(--spring);}
  .day:active .dot{transform:scale(.88);}
  .day .dot{width:34px;height:34px;border-radius:50%;border:1px solid var(--hair2);display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;color:var(--mut);background:var(--bg);}
  .day.done .dot{background:var(--ink);border-color:var(--ink);color:#fff;}
  .day.today .dot{border:2px solid var(--acc);color:var(--acc-d);font-weight:800;}
  .day.today.done .dot{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:0 0 0 2px var(--acc);}
  .hero-foot{position:relative;display:flex;align-items:center;gap:8px;margin-top:16px;flex-wrap:wrap;}
  .hero-msg{font-size:13px;color:var(--ink2);flex:1;min-width:150px;}

  /* ================= SESSION CARDS ================= */
  .reco{position:relative;background:var(--bg);border:1px solid var(--hair);border-radius:var(--r);box-shadow:var(--sh);
    padding:18px 18px 16px 21px;margin-bottom:12px;overflow:hidden;}
  .reco-bar{position:absolute;left:0;top:0;bottom:0;width:5px;}
  .reco-tag{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--acc-d);margin-bottom:7px;display:flex;align-items:center;gap:6px;}
  .reco-tag.done{color:var(--ok-d);}
  .reco-name{font-family:var(--f-disp);font-size:21px;font-weight:700;letter-spacing:-.01em;}
  .reco-sub{font-size:13px;color:var(--ink2);margin:3px 0 14px;}
  .reco-meta{display:flex;gap:16px;font-size:12px;color:var(--mut);font-weight:600;margin-bottom:15px;}
  .reco-meta span{display:flex;align-items:center;gap:5px;}

  .sess-list{background:var(--bg);border:1px solid var(--hair);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;}
  .sess-row{display:flex;align-items:center;gap:13px;text-align:left;padding:14px 15px;width:100%;
    background:none;border:none;border-bottom:1px solid var(--hair);cursor:pointer;color:var(--ink);font-family:var(--f-ui);transition:background .15s;}
  .sess-row:last-child{border-bottom:none;}
  .sess-row:active{background:var(--bg2);}
  .sess-dot{width:4px;height:40px;border-radius:3px;flex:none;}
  .sess-main{flex:1;min-width:0;}
  .sess-name{display:block;font-weight:700;font-size:15px;letter-spacing:-.01em;}
  .sess-sub{display:block;font-size:12px;color:var(--ink2);margin-top:2px;}
  .sess-meta{display:block;font-size:11px;color:var(--mut);margin-top:3px;font-weight:600;}
  .sess-done{color:var(--ok-d);font-weight:800;}
  .sess-arrow{color:var(--mut);flex:none;}

  .resume-card{background:var(--acc-soft);border:1px solid #ffd9c4;border-radius:var(--r);padding:16px;margin-top:14px;}
  .resume-card .t{font-weight:800;font-size:14.5px;color:var(--acc-d);display:flex;align-items:center;gap:8px;}
  .resume-card .s{font-size:12.5px;color:var(--ink2);margin:5px 0 12px;}

  .banner{display:flex;gap:11px;background:var(--bg2);border:1px solid var(--hair);border-radius:14px;
    padding:12px 14px;margin-bottom:12px;font-size:12.5px;color:var(--ink2);}
  .banner b{color:var(--ink);}
  .banner .ic{flex:none;color:var(--acc);margin-top:1px;}

  /* ================= WORKOUT ================= */
  .sess-head{background:var(--bg);border:1px solid var(--hair);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-top:14px;margin-bottom:12px;}
  .sess-head-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .sh-name{font-family:var(--f-disp);font-size:20px;font-weight:700;letter-spacing:-.01em;}
  .sh-focus{font-size:12.5px;color:var(--ink2);margin-top:2px;}
  .sh-time{display:flex;align-items:center;gap:6px;background:var(--ink);color:#fff;border-radius:11px;padding:7px 11px;
    font-family:var(--f-disp);font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;flex:none;}
  .sh-time svg{color:var(--acc);}
  .sh-week{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap;}
  .rir-chip{background:var(--amber-soft);color:var(--amber);border-radius:7px;padding:3px 9px;font-weight:800;font-size:11.5px;}
  .sh-note{font-size:12.5px;color:var(--mut);margin-top:7px;}
  .sess-prog{margin-top:14px;}
  .sess-prog .lbl{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
  .sess-prog .lbl b{font-family:var(--f-disp);font-size:14px;font-variant-numeric:tabular-nums;}
  .ptrack{height:6px;background:var(--bg3);border-radius:99px;overflow:hidden;}
  .ptrack .fill{height:100%;background:var(--acc);border-radius:99px;transition:width .35s var(--spring);}
  .ptrack .fill.green{background:var(--ok);}
  .ptrack.mini{height:5px;}

  /* EXERCISE CARD */
  .ex-card{position:relative;background:var(--bg);border:1px solid var(--hair);border-radius:var(--r);
    margin-bottom:12px;overflow:hidden;box-shadow:var(--sh);transition:opacity .3s;}
  .ex-card.card-done{opacity:.55;}
  .ex-bar{position:absolute;left:0;top:0;bottom:0;width:4px;}
  .ex-card.card-done .ex-bar{background:var(--ok)!important;}
  .ex-body{padding:14px 15px 14px 18px;}
  .ex-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
  .ex-muscle{font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;margin-bottom:4px;display:flex;align-items:center;gap:6px;}
  .warn-badge{color:var(--amber);}
  .ex-title{font-family:var(--f-disp);font-weight:600;font-size:16px;letter-spacing:-.005em;line-height:1.25;}
  .ex-title .opt{font-size:9.5px;font-weight:800;color:var(--mut);background:var(--bg2);border:1px solid var(--hair);padding:2px 7px;border-radius:6px;margin-left:6px;vertical-align:2px;text-transform:uppercase;letter-spacing:.05em;}
  .ex-prog{font-family:var(--f-disp);font-variant-numeric:tabular-nums;font-weight:700;font-size:12.5px;color:var(--ink2);
    border:1px solid var(--hair2);border-radius:99px;padding:5px 11px;white-space:nowrap;flex:none;}
  .ex-prog.full{color:#fff;background:var(--ok);border-color:var(--ok);}
  .ex-meta{font-size:12.5px;color:var(--ink2);margin:6px 0 2px;font-weight:600;}
  .ex-prev{font-size:12px;color:var(--mut);margin:7px 0 4px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .progress-badge{background:var(--ok-soft);color:var(--ok-d);font-weight:800;font-size:10.5px;padding:3px 9px;border-radius:99px;letter-spacing:.02em;}

  /* SET ROWS */
  .sets{margin-top:11px;display:flex;flex-direction:column;gap:7px;}
  .set-labels{display:grid;grid-template-columns:28px 1fr 1fr 46px 44px;gap:6px;font-size:9.5px;color:var(--mut);
    text-transform:uppercase;letter-spacing:.07em;font-weight:800;padding:0 7px;margin-bottom:-1px;}
  .set-labels span{text-align:center;}
  .set-row{display:grid;grid-template-columns:28px 1fr 1fr 46px 44px;gap:6px;align-items:center;
    background:var(--bg2);border-radius:13px;padding:6px;border:1px solid var(--hair);transition:background .25s,border-color .25s;}
  .set-row.done{background:var(--ok-soft);border-color:var(--ok-hair);}
  .set-num{width:28px;height:28px;border-radius:9px;background:var(--bg3);display:flex;align-items:center;justify-content:center;
    font-family:var(--f-disp);font-weight:700;font-size:12.5px;color:var(--ink2);}
  .set-row.done .set-num{background:var(--ok);color:#fff;}
  .field{display:flex;align-items:center;background:var(--bg);border-radius:10px;overflow:hidden;border:1px solid var(--hair2);}
  .field .step{width:26px;height:40px;border:none;background:transparent;color:var(--mut);font-size:18px;font-weight:600;cursor:pointer;flex:none;font-family:var(--f-ui);
    user-select:none;-webkit-user-select:none;touch-action:manipulation;}
  .field .step:active{background:var(--bg2);color:var(--acc-d);}
  .field .val{width:100%;min-width:0;border:none;background:transparent;color:var(--ink);text-align:center;
    font-family:var(--f-disp);font-size:15px;font-weight:600;padding:10px 0;font-variant-numeric:tabular-nums;}
  .field .val:focus{outline:none;}
  .field.rir{justify-content:center;}
  .field.rir .val{padding:10px 4px;}
  .done-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--hair2);background:var(--bg);color:var(--mut);

  .tb-ex{font-size:12px;color:var(--ink2);font-weight:700;max-width:58%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

    display:flex;align-items:center;justify-content:center;gap:5px;}

  .stat .v{font-family:var(--f-disp);font-size:26px;font-weight:700;line-height:1.15;margin-top:5px;letter-spacing:-.02em;}

  #modal-root{position:fixed;inset:0;z-index:200;display:none;align-items:flex-end;justify-content:center;

  .modal{background:var(--bg);border-radius:26px 26px 0 0;width:100%;max-width:560px;

  .pr-list{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0;}

  #tip.show{opacity:1;}

  #errbar{position:fixed;top:0;left:0;right:0;background:var(--red);color:#fff;padding:8px;font-size:12px;z-index:999;text-align:center;}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}

/* ============ HELPERS ============ */
function $(s,r){return (r||document).querySelector(s);}
function todayISO(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function pad(n){return n<10?'0'+n:''+n;}
function num(v){if(v==null)return 0;var n=parseFloat(String(v).replace(',','.'));return isNaN(n)?0:n;}
function fmtTime(s){s=Math.max(0,Math.round(s));return pad(Math.floor(s/60))+':'+pad(s%60);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function extractNum(load){if(!load)return '';if(/rir|pdc|léger|leger|modéré|modere/i.test(load))return '';var m=load.match(/\d+([.,]\d+)?/);return m?String(num(m[0])):'';}
function shortDate(iso){return new Date(iso+'T12:00').toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'});}
function daysAgo(iso){var d=daysAgoNum(iso);return d<=0?'aujourd’hui':d===1?'hier':'il y a '+d+'j';}
function daysAgoNum(iso){return Math.round((new Date(todayISO()+'T12:00')-new Date(iso+'T12:00'))/86400000);}
function recoSessionId(){var m={1:'hautA',3:'pull',5:'hautB'};return m[new Date().getDay()]||null;}
function frNum(n,dec){return n.toLocaleString('fr-FR',{maximumFractionDigits:dec==null?0:dec});}
function fmtK(n){n=Math.round(n);if(n>=100000)return frNum(n/1000,0)+' k';if(n>=1000)return frNum(n/1000,1)+' k';return frNum(n);}

function addDaysISO(iso,n){var d=new Date(iso+'T12:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function weekStartISO(iso){var d=new Date(iso+'T12:00');var off=(d.getDay()+6)%7;d.setDate(d.getDate()-off);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function sessionsInWeek(ws){return state.history.filter(function(h){return weekStartISO(h.dateISO)===ws;});}
function histVol(h){var v=0;Object.keys(h.logs).forEach(function(k){h.logs[k].forEach(function(s){if(s.done)v+=num(s.w)*num(s.r);});});return v;}
function weeklyStats(){
  var ws=weekStartISO(todayISO()),list=sessionsInWeek(ws),goal=state.settings.goal||3;
  var mains=MAIN_SESSIONS.map(function(id){return {id:id,done:list.some(function(h){return h.sessionId===id;})};});
  var bonus=list.filter(function(h){return h.sessionId==='bras';}).length;
  return {ws:ws,count:list.length,goal:goal,pct:Math.min(100,Math.round(list.length/goal*100)),mains:mains,bonus:bonus,doneDays:list.map(function(h){return h.dateISO;})};
}
function weekStreak(){
  var goal=state.settings.goal||3,streak=0,ws=weekStartISO(todayISO());
  if(sessionsInWeek(ws).length>=goal)streak++;
  var prev=addDaysISO(ws,-7);
  while(sessionsInWeek(prev).length>=goal){streak++;prev=addDaysISO(prev,-7);}
  return streak;
}
function estMin(s){var t=0;s.ex.forEach(function(e){if(!e.optional)t+=e.sets*(e.rest+45);});return Math.round(t/60/5)*5;}

  return 'https://www.youtube.com/results?search_query='+encodeURIComponent(q);}

function lastPerf(exId){for(var i=state.history.length-1;i>=0;i--){var h=state.history[i],arr=h.logs[exId];if(arr){var done=arr.filter(function(s){return s.done&&String(s.r)!=='';});if(done.length)return {date:h.dateISO,sets:done};}}return null;}
function histFor(exId){var out=[];state.history.forEach(function(h){var arr=h.logs[exId];if(arr){var done=arr.filter(function(s){return s.done&&String(s.r)!=='';});if(done.length)out.push({date:h.dateISO,sets:done});}});return out;}
function bestWeight(exId,before){var m=0;state.history.forEach(function(h){if(before&&h.dateISO>=before)return;(h.logs[exId]||[]).forEach(function(s){if(s.done)m=Math.max(m,num(s.w));});});return m;}

/* ============ WORKOUT LIFECYCLE ============ */
function startWorkout(sid){
  var s=SESSMAP[sid];if(!s)return;
  var logs={};
  s.ex.forEach(function(e){
    var lp=lastPerf(e.id),arr=[];
    for(var i=0;i<e.sets;i++){
      var w='',r='';
      if(lp){var ls=lp.sets[i]||lp.sets[lp.sets.length-1];if(ls){w=ls.w||'';r=ls.r||'';}}
      if(w===''||w==null)w=extractNum(e.load);
      if(r===''||r==null)r=String(e.repMin);
      arr.push({w:String(w),r:String(r),rir:'',done:false});
    }
    logs[e.id]=arr;
  });
  state.activeWorkout={sessionId:sid,dateISO:todayISO(),week:state.settings.week,startedAt:Date.now(),logs:logs};
  state.ui.forcePicker=false;state.ui.tab='workout';
  save();requestWake();render();window.scrollTo(0,0);
}
function finishWorkout(){
  var w=state.activeWorkout;if(!w)return;
  var sess=SESSMAP[w.sessionId];
  var setsDone=0,vol=0,prs=[];
  sess.ex.forEach(function(e){
    var prev=bestWeight(e.id,w.dateISO),maxW=0;
    (w.logs[e.id]||[]).forEach(function(s){if(s.done){setsDone++;vol+=num(s.w)*num(s.r);maxW=Math.max(maxW,num(s.w));}});
    if(maxW>0&&prev>0&&maxW>prev)prs.push(e.name+' '+maxW+' kg');
  });
  var dur=Math.round((Date.now()-w.startedAt)/1000),hid='h'+Date.now();
  state.history.push({id:hid,sessionId:w.sessionId,dateISO:w.dateISO,week:w.week,durationSec:dur,logs:w.logs});
  state.activeWorkout=null;releaseWake();save();
  showSummary({name:sess.name,dur:dur,setsDone:setsDone,vol:Math.round(vol),prs:prs,hid:hid});
}
function cancelWorkout(){state.activeWorkout=null;state.ui.forcePicker=false;releaseWake();save();render();}

function niceMax(v){if(v<=0)return 1;var p=Math.pow(10,Math.floor(Math.log10(v)));var st=[1,1.5,2,2.5,3,4,5,6,8,10];for(var i=0;i<st.length;i++){if(st[i]*p>=v)return st[i]*p;}return 10*p;}
function barTop(x,y,w,h,r){r=Math.min(r,w/2,h);var x2=x+w;
  return 'M'+x.toFixed(1)+','+(y+h).toFixed(1)+' L'+x.toFixed(1)+','+(y+r).toFixed(1)+' Q'+x.toFixed(1)+','+y.toFixed(1)+' '+(x+r).toFixed(1)+','+y.toFixed(1)+
  ' L'+(x2-r).toFixed(1)+','+y.toFixed(1)+' Q'+x2.toFixed(1)+','+y.toFixed(1)+' '+x2.toFixed(1)+','+(y+r).toFixed(1)+' L'+x2.toFixed(1)+','+(y+h).toFixed(1)+' Z';}
/* items: [{label, v, tip}] — dernier = période courante (accent), autres en gris neutre */
function barChart(items,opts){

  var slot=plotW/n,barW=Math.min(24,slot*0.6);
  var s='<svg class="chart-svg" viewBox="0 0 '+W+' '+H+'">';
  [0.5,1].forEach(function(f){var y=base-f*plotH;
    s+='<line x1="'+px+'" y1="'+y.toFixed(1)+'" x2="'+(W-px)+'" y2="'+y.toFixed(1)+'" stroke="var(--grid)" stroke-width="1"/>';
    s+='<text x="'+(px+1)+'" y="'+(y-4).toFixed(1)+'" font-size="9" fill="var(--mut)">'+(opts.fmt||fmtK)(max*f)+'</text>';});
  s+='<line x1="'+px+'" y1="'+base+'" x2="'+(W-px)+'" y2="'+base+'" stroke="var(--baseline)" stroke-width="1"/>';
  if(opts.goal){var gy=base-(opts.goal/max)*plotH;

    s+='<text x="'+(W-px-1)+'" y="'+(gy-4).toFixed(1)+'" font-size="8.5" font-weight="800" letter-spacing=".08em" fill="var(--ink)" text-anchor="end">OBJECTIF '+opts.goal+'</text>';}
  items.forEach(function(it,i){
    var x=px+i*slot+(slot-barW)/2,h=max?(it.v/max)*plotH:0,y=base-h;
    if(it.v>0)s+='<g class="bgrow" style="--d:'+(i*45)+'ms"><path d="'+barTop(x,y,barW,h,4)+'" fill="'+(i===n-1?'var(--acc)':'var(--chart-de)')+'"/></g>';
    else s+='<rect x="'+x.toFixed(1)+'" y="'+(base-2)+'" width="'+barW.toFixed(1)+'" height="2" rx="1" fill="var(--hair2)"/>';
    if(i===n-1&&it.v>0)s+='<text class="vlabel" x="'+(x+barW/2).toFixed(1)+'" y="'+(y-6).toFixed(1)+'" font-size="10" font-weight="700" fill="var(--ink2)" text-anchor="middle">'+(opts.fmt||fmtK)(it.v)+'</text>';
    s+='<rect x="'+(px+i*slot).toFixed(1)+'" y="'+pt+'" width="'+slot.toFixed(1)+'" height="'+(plotH+pb).toFixed(1)+'" fill="transparent" data-tip="'+esc(it.tip)+'"/>';
    s+='<text x="'+(x+barW/2).toFixed(1)+'" y="'+(base+14)+'" font-size="9" fill="var(--mut)" text-anchor="middle">'+esc(it.label)+'</text>';

/* pts: [{d:dateISO, v}] */
function lineChart(pts,opts){
  opts=opts||{};
  var W=340,H=176,pl=38,pr=16,pt=20,pb=24,n=pts.length;
  var plotW=W-pl-pr,plotH=H-pt-pb,base=H-pb;
  var vmin=Infinity,vmax=-Infinity;pts.forEach(function(p){if(p.v<vmin)vmin=p.v;if(p.v>vmax)vmax=p.v;});
  var rng=(vmax-vmin)||Math.max(vmax*0.2,1);
  var dmin=vmin-rng*0.15,dmax=vmax+rng*0.18;
  function X(i){return pl+(n>1?i*plotW/(n-1):plotW/2);}
  function Y(v){return pt+(1-(v-dmin)/(dmax-dmin))*plotH;}
  var fmt=opts.fmt||function(v){return frNum(v,1);};
  var s='<svg class="chart-svg" viewBox="0 0 '+W+' '+H+'">';
  [vmin,(vmin+vmax)/2,vmax].forEach(function(gv){var y=Y(gv);
    s+='<line x1="'+pl+'" y1="'+y.toFixed(1)+'" x2="'+(W-pr)+'" y2="'+y.toFixed(1)+'" stroke="var(--grid)" stroke-width="1"/>';
    s+='<text x="'+(pl-6)+'" y="'+(y+3).toFixed(1)+'" font-size="9" fill="var(--mut)" text-anchor="end">'+fmt(gv)+'</text>';});
  var line=pts.map(function(p,i){return X(i).toFixed(1)+','+Y(p.v).toFixed(1);}).join(' ');
  s+='<polygon class="areafade" points="'+X(0).toFixed(1)+','+base+' '+line+' '+X(n-1).toFixed(1)+','+base+'" fill="var(--acc)" opacity="0.07"/>';
  s+='<polyline class="ldraw" pathLength="1" points="'+line+'" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  pts.forEach(function(p,i){
    s+='<circle class="dotpop" style="--d:'+(150+i*70)+'ms" cx="'+X(i).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="3.5" fill="var(--acc)" stroke="var(--bg)" stroke-width="2"/>';
    s+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="11" fill="transparent" data-tip="'+shortDate(p.d)+' · '+esc(fmt(p.v))+(opts.unit?' '+opts.unit:'')+'"/>';
  });
  var lx=X(n-1),ly=Y(pts[n-1].v)-9;
  s+='<text class="vlabel" x="'+Math.min(lx,W-pr).toFixed(1)+'" y="'+ly.toFixed(1)+'" font-size="11" font-weight="800" fill="var(--ink)" text-anchor="end">'+fmt(pts[n-1].v)+(opts.unit?' '+opts.unit:'')+'</text>';
  s+='<text x="'+pl+'" y="'+(H-8)+'" font-size="9" fill="var(--mut)">'+shortDate(pts[0].d)+'</text>';
  s+='<text x="'+(W-pr)+'" y="'+(H-8)+'" font-size="9" fill="var(--mut)" text-anchor="end">'+shortDate(pts[n-1].d)+'</text>';
  return s+'</svg>';
}
function spark(vals){
  var w=64,hh=32,p=4;
  if(!vals.length)return '<svg class="spark" width="'+w+'" height="'+hh+'"></svg>';
  if(vals.length===1)return '<svg class="spark" width="'+w+'" height="'+hh+'"><circle cx="'+(w/2)+'" cy="'+(hh/2)+'" r="3.5" fill="var(--acc)" stroke="var(--bg)" stroke-width="2"/></svg>';
  var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),rng=(mx-mn)||1;
  var pts=vals.map(function(v,i){var x=p+i*(w-2*p)/(vals.length-1);var y=hh-p-((v-mn)/rng)*(hh-2*p);return [x,y];});
  var line=pts.map(function(pt){return pt[0].toFixed(1)+','+pt[1].toFixed(1);}).join(' ');
  var last=pts[pts.length-1];
  return '<svg class="spark" width="'+w+'" height="'+hh+'"><polyline fill="none" stroke="var(--chart-de)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="'+line+'"/>'+
    '<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="3" fill="var(--acc)" stroke="var(--bg)" stroke-width="1.5"/></svg>';
}

/* ============ ANIM UTILS ============ */
var REDUCED=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function runCounters(){
  document.querySelectorAll('[data-count]').forEach(function(el){
    var target=parseFloat(el.dataset.count),fmt=el.dataset.cfmt||'int';
    function fm(v){
      if(fmt==='pct')return Math.round(v)+'<span class="pcent">%</span>';
      if(fmt==='k')return fmtK(v);
      return frNum(Math.round(v));
    }
    if(REDUCED){el.innerHTML=fm(target);return;}
    var t0=performance.now(),dur=900;
    (function step(t){
      var p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);
      el.innerHTML=fm(target*e);
      if(p<1)requestAnimationFrame(step);
    })(t0);
  });
}
function staggerView(){
  var v=$('#view');var i=0;
  Array.prototype.forEach.call(v.children,function(c){c.style.setProperty('--i',i++);});
}
function confettiBurst(){
  if(REDUCED)return;
  var cv=document.createElement('canvas'),ctx=cv.getContext('2d');
  var dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;
  cv.style.cssText='position:fixed;inset:0;width:100%;height:100%;z-index:400;pointer-events:none;';
  document.body.appendChild(cv);ctx.scale(dpr,dpr);
  var colors=['#ff4d00','#0b0b0e','#0ca154','#c97b00','#2a78d6','#d0549b'];
  var parts=[];
  for(var i=0;i<130;i++){
    var side=i%2?1:-1;
    parts.push({x:innerWidth/2+side*innerWidth*0.28,y:innerHeight*0.62,
      vx:(Math.random()*4+1.5)*-side+(Math.random()-0.5)*3,vy:-(Math.random()*9+7),
      w:Math.random()*7+4,h:Math.random()*4+3,rot:Math.random()*Math.PI,vr:(Math.random()-.5)*.3,
      c:colors[i%colors.length],life:1});
  }
  var t0=performance.now();
  (function frame(t){
    var dt=(t-t0)/1000;
    ctx.clearRect(0,0,innerWidth,innerHeight);
    var alive=false;
    parts.forEach(function(p){
      p.vy+=0.22;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;
      p.life=Math.max(0,1-dt/1.9);
      if(p.y<innerHeight+30&&p.life>0)alive=true;
      ctx.save();ctx.globalAlpha=p.life;ctx.translate(p.x,p.y);ctx.rotate(p.rot);
      ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();
    });
    if(alive&&dt<2.2)requestAnimationFrame(frame);else cv.remove();
  })(t0);
}

  var tabChanged=lastTab!==state.ui.tab;
  if(tabChanged){
    v.classList.remove('enter');void v.offsetWidth;v.classList.add('enter');
    staggerView();lastTab=state.ui.tab;

  runCounters();

function paintHdrProg(){

function exCard(e,logs){
  logs=logs||[];
  var done=logs.filter(function(s){return s.done;}).length,full=done>0&&done>=logs.length;
  var color='var(--m-'+e.muscle+')';
  var unit=e.unit==='s'?'s':'';
  var lp=lastPerf(e.id),prev='',ready=false;
  if(lp){
    var summ=lp.sets.map(function(s){return s.r+unit;}).join(', ');
    var ws=lp.sets[0]?lp.sets[0].w:'';
    prev='Dernière fois ('+daysAgo(lp.date)+') : '+(ws?ws+' kg × ':'')+summ;
    ready=lp.sets.every(function(s){return num(s.r)>=e.repMax;});
  }else prev='Première fois — note tes charges';
  var notesOpen=!!(state.ui.notes&&state.ui.notes[e.id]);
  var h='<div class="ex-card '+(full?'card-done':'')+'" data-ex="'+e.id+'"><div class="ex-bar" style="background:'+color+'"></div><div class="ex-body">';
  h+='<div class="ex-head"><div>'+
     '<div class="ex-muscle" style="color:'+color+'">'+esc(MUSCLES[e.muscle]||e.muscle)+(e.shoulder?' <span class="warn-badge">'+icon('alert',11,2.2)+' épaule</span>':'')+'</div>'+
     '<div class="ex-title">'+esc(e.name)+(e.optional?'<span class="opt">option</span>':'')+'</div></div>';
  h+='<div class="ex-prog '+(full?'full':'')+'">'+done+'/'+logs.length+'</div></div>';
  h+='<div class="ex-meta">'+e.sets+' × '+e.repMin+'-'+e.repMax+unit+' · '+esc(e.load)+' · repos '+fmtTime(e.rest)+'</div>';
  h+='<div class="ex-prev">'+esc(prev)+(ready?' <span class="progress-badge">↑ prêt à monter</span>':'')+
     '<a class="chip chip-yt" href="'+ytURL(e)+'" target="_blank" rel="noopener noreferrer" aria-label="Voir un tutoriel YouTube pour cet exercice">'+icon('video',12,2)+'Tuto</a></div>';
  h+='<div class="set-labels"><span>#</span><span>'+(e.unit==='s'?'charge':'kg')+'</span><span>'+(e.unit==='s'?'sec':'reps')+'</span><span>RIR</span><span></span></div>';
  h+='<div class="sets">';
  logs.forEach(function(s,i){h+=setRow(e,i,s);});
  h+='</div><button class="add-set" data-action="add-set">+ ajouter une série</button>';
  h+='<details class="ex-notes" data-ex="'+e.id+'"'+(notesOpen?' open':'')+'><summary>Notes & consignes'+(e.shoulder?' · ⚠ épaule':'')+'</summary>';
  if(e.cue)h+='<p>'+esc(e.cue)+'</p>';
  if(e.shoulder){if(e.amp)h+='<p class="amp"><b>Amplitude :</b> '+esc(e.amp)+'</p>';if(e.warn)h+='<p class="warn"><b>⚠ Stop si :</b> '+esc(e.warn)+'</p>';}
  h+='</details></div></div>';
  return h;
}
function setRow(e,i,s){

    '<div class="set-num">'+(i+1)+'</div>'+

/* ===== PROGRESS ===== */

      '<span class="jmain"><span class="jname">'+esc(s.name)+'</span><span class="jsub">'+dlab+(en.durationSec?' · '+fmtTime(en.durationSec):'')+'</span></span>'+
      '<span class="jright"><b>'+frNum(vol)+' kg</b><span class="jsets">'+ns+' séries</span></span>'+
      '<span class="jchev">'+icon('chevron',16,2)+'</span></button>';
  });
  h+='</div>';
  if(hist.length>6)h+='<button class="btn btn-ghost btn-block btn-sm" data-action="j-toggle">'+(state.ui.jAll?'Réduire':'Voir tout l’historique ('+hist.length+' séances)')+'</button>';

  /* Poids corporel */
  h+='<h2>Poids corporel</h2>';

    if(!refE&&bw.length>1)refE=bw[0];
    var dtxt='Dernier relevé '+daysAgo(lastE.d);
    if(refE){var dw=Math.round((lastE.w-refE.w)*10)/10;
      dtxt=(dw>0?'+':'')+frNum(dw,1)+' kg depuis le '+shortDate(refE.d)+' · relevé '+daysAgo(lastE.d);}
    h+='<div class="bw-top"><div><div class="bw-val">'+frNum(lastE.w,1)+'<small> kg</small></div>'+
      '<div class="bw-delta">'+dtxt+'</div></div>'+
      '<button class="btn btn-ghost btn-sm" data-action="bw-add">+ Ajouter</button></div>';
    if(bw.length>1)h+=lineChart(bw.slice(-16).map(function(e2){return {d:e2.d,v:e2.w};}),{unit:'kg',fmt:function(v){return frNum(v,1);}});
    h+='<details class="ex-notes" data-ex="bw_hist"'+(state.ui.notes&&state.ui.notes.bw_hist?' open':'')+'><summary>Historique ('+bw.length+' relevés)</summary><table class="htable">';
    for(var bj=bw.length-1;bj>=Math.max(0,bw.length-10);bj--){
      h+='<tr><td>'+shortDate(bw[bj].d)+'</td><td>'+frNum(bw[bj].w,1)+' kg '+
        '<button class="mini-del" data-action="bw-del" data-d="'+bw[bj].d+'" aria-label="Supprimer ce relevé">'+icon('trash',13,2)+'</button></td></tr>';
    }
    h+='</table></details>';
  }else{
    h+='<div class="ct">Suis ton poids</div>'+
      '<div class="cs">Un relevé par semaine (le matin, à jeun) suffit pour voir la tendance à côté de ton volume d’entraînement.</div>'+
      '<button class="btn btn-primary btn-block" style="margin-top:8px" data-action="bw-add">+ Ajouter mon poids</button>';
  }
  h+='</div>';

  /* 8 dernières semaines */

  for(var i=7;i>=0;i--)weeks.push(addDaysISO(ws,-7*i));
  var sessItems=weeks.map(function(w){var n=sessionsInWeek(w).length;
    return {label:shortDate(w),v:n,tip:'Sem. du '+shortDate(w)+' · '+n+' séance'+(n>1?'s':'')};});
  var volItems=weeks.map(function(w){var v=0;sessionsInWeek(w).forEach(function(h2){v+=histVol(h2);});
    return {label:shortDate(w),v:Math.round(v),tip:'Sem. du '+shortDate(w)+' · '+frNum(Math.round(v))+' kg'};});
  h+='<h2>Assiduité</h2><div class="card chart-card"><div class="ct">Séances par semaine</div>'+
    '<div class="cs">8 dernières semaines · semaine en cours en orange</div>'+
    barChart(sessItems,{goal:stats.goal,intScale:true,fmt:function(v){return frNum(v);}})+'</div>';
  var curV=volItems[volItems.length-1].v,prevV=volItems[volItems.length-2].v,volDelta='';

  }
  h+='<div class="card chart-card"><div class="ct">Volume par semaine</div>'+

  /* Répartition par muscle — cette semaine */

    h+='</div></div>';

  var ids=[];Object.keys(EXMAP).forEach(function(id){if(histFor(id).length)ids.push(id);});
  ids.sort(function(a,b){return EXMAP[a].muscle.localeCompare(EXMAP[b].muscle);});
  h+='<h2>Progression par exercice</h2>';
  ids.forEach(function(id){h+=progCard(id);});
  return h;
}
function progCard(id){
  var e=EXMAP[id],hs=histFor(id),open=state.ui.openEx==='p_'+id;
  var weighted=hs.some(function(en){return en.sets.some(function(s){return num(s.w)>0;});});
  var vals=hs.map(function(en){var m=0;en.sets.forEach(function(s){var v=weighted?e1rm(num(s.w),num(s.r)):num(s.r);if(v>m)m=v;});return m;});
  var bestRaw=0;hs.forEach(function(en){en.sets.forEach(function(s){var v=weighted?num(s.w):num(s.r);if(v>bestRaw)bestRaw=v;});});
  var unitTxt=weighted?'kg':(e.unit==='s'?'s':'reps');
  var last=hs[hs.length-1];
  var delta='';
  if(vals.length>1&&vals[0]>0){
    var d=Math.round((vals[vals.length-1]-vals[0])/vals[0]*100);
    if(d!==0)delta='<span style="color:'+(d>0?'var(--ok-d)':'var(--amber)')+';font-weight:800"> '+(d>0?'+':'')+d+'%</span>';
  }
  var h='<div class="pcard"><div class="pcard-head" data-action="toggle-prog" data-ex="'+id+'">'+
    '<div class="pcard-info"><div class="pcard-name">'+esc(e.name)+'</div>'+
    '<div class="pcard-sub" style="color:var(--m-'+e.muscle+')">'+esc((MUSCLES[e.muscle]||e.muscle).toUpperCase())+'</div>'+
    '<div class="pcard-sub">'+hs.length+' séance'+(hs.length>1?'s':'')+' · '+daysAgo(last.date)+delta+'</div></div>'+
    spark(vals)+
    '<div class="pcard-best"><div class="v">'+frNum(bestRaw,1)+' '+unitTxt+'</div><div class="l">record</div></div></div>';
  if(open){
    h+='<div class="pcard-detail">';
    if(hs.length>1){
      var pts=hs.map(function(en,i){return {d:en.date,v:Math.round(vals[i]*10)/10};});
      if(pts.length>12)pts=pts.slice(pts.length-12);
      h+='<div class="micro" style="margin-bottom:4px">'+(weighted?'1RM estimé (charge × reps)':'Meilleure série')+'</div>';
      h+=lineChart(pts,{unit:weighted?'kg':unitTxt,fmt:function(v){return frNum(v,1);}});
    }
    h+='<table class="htable">';
    for(var i=hs.length-1;i>=0;i--){var en=hs[i];

/* ============ REST TIMER ============ */
var Timer={total:0,remaining:0,running:false,endAt:0,iv:null,done:false,label:''};
function startTimer(sec,label){
  if(!sec)return;
  Timer.total=sec;Timer.remaining=sec;Timer.endAt=Date.now()+sec*1000;Timer.running=true;Timer.done=false;Timer.label=label||'Repos';
  $('#timerbar').classList.remove('hidden','done');$('#tbToggle').innerHTML=icon('pause',15,2.4);
  paintTimer();clearInterval(Timer.iv);Timer.iv=setInterval(tickTimer,200);
}
function tickTimer(){
  if(!Timer.running)return;
  var rem=Math.round((Timer.endAt-Date.now())/1000);Timer.remaining=Math.max(0,rem);paintTimer();
  if(rem<=0){Timer.running=false;Timer.done=true;clearInterval(Timer.iv);$('#timerbar').classList.add('done');$('#tbEx').textContent='Repos terminé — c’est reparti !';$('#tbTime').classList.remove('urgent');beepEnd();doVibrate([300,120,300,120,300]);setTimeout(function(){if(Timer.done)hideTimer();},5000);}
}
function paintTimer(){
  var t=$('#tbTime');t.textContent=fmtTime(Timer.remaining);
  t.classList.toggle('urgent',!Timer.done&&Timer.running&&Timer.remaining<=5&&Timer.remaining>0);
  if(!Timer.done)$('#tbEx').textContent='Repos · '+Timer.label;
  var pct=Timer.total?Math.max(0,Math.min(100,(Timer.remaining/Timer.total)*100)):0;$('#tbFill').style.width=pct+'%';
}
function hideTimer(){Timer.running=false;clearInterval(Timer.iv);$('#timerbar').classList.add('hidden');$('#tbTime').classList.remove('urgent');Timer.done=false;}
function toggleTimer(){if(Timer.done)return;if(Timer.running){Timer.running=false;$('#tbToggle').innerHTML=icon('play',15,2.4);}else{Timer.running=true;Timer.endAt=Date.now()+Timer.remaining*1000;$('#tbToggle').innerHTML=icon('pause',15,2.4);}}
function bumpTimer(d){Timer.remaining=Math.max(0,Timer.remaining+d);if(Timer.remaining>Timer.total)Timer.total=Timer.remaining;Timer.endAt=Date.now()+Timer.remaining*1000;if(Timer.done&&Timer.remaining>0){Timer.done=false;Timer.running=true;$('#timerbar').classList.remove('done');$('#tbToggle').innerHTML=icon('pause',15,2.4);}paintTimer();}

/* AUDIO + VIBRATE + WAKELOCK */
var actx=null;
function resumeAudio(){try{if(!actx){var C=window.AudioContext||window.webkitAudioContext;if(C)actx=new C();}if(actx&&actx.state==='suspended')actx.resume();}catch(e){}}
function beep(freq,start,dur){var o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);o.type='sine';o.frequency.value=freq;var t=actx.currentTime+start;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.35,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.start(t);o.stop(t+dur+.02);}
function beepEnd(){if(!state.settings.sound)return;try{resumeAudio();if(!actx)return;beep(880,0,.18);beep(880,.22,.18);beep(1175,.44,.30);}catch(e){}}
function doVibrate(p){if(!state.settings.vibrate)return;try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}
var wakeLock=null;
function requestWake(){if(!state.settings.keepAwake)return;try{if('wakeLock'in navigator)navigator.wakeLock.request('screen').then(function(w){wakeLock=w;}).catch(function(){});}catch(e){}}
function releaseWake(){try{if(wakeLock){wakeLock.release();wakeLock=null;}}catch(e){}}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&state.activeWorkout&&state.settings.keepAwake)requestWake();});

/* steppers : clic simple + auto-répétition à l'appui long (utile pour monter les charges) */
var Rep={t:null,iv:null,fired:false,el:null};
function doStep(btn){
  var row=btn.closest('.set-row'),card=btn.closest('.ex-card');if(!row||!card)return;
  var exId=card.dataset.ex,i=+row.dataset.set,f=btn.dataset.field,step=+btn.dataset.step;
  var inp=row.querySelector('.val[data-field="'+f+'"]');if(!inp)return;
  var v=num(inp.value)+step;if(v<0)v=0;if(f!=='w')v=Math.round(v);v=+v.toFixed(2);
  inp.value=(v===0&&f==='w')?'':String(v);
  if(state.activeWorkout&&state.activeWorkout.logs[exId]&&state.activeWorkout.logs[exId][i])state.activeWorkout.logs[exId][i][f]=inp.value;
  saveSoon();
}
function stopRep(){clearTimeout(Rep.t);clearInterval(Rep.iv);Rep.t=null;Rep.iv=null;}
document.addEventListener('pointerdown',function(e){
  var st=e.target.closest('.step');if(!st)return;
  Rep.fired=false;Rep.el=st;stopRep();
  Rep.t=setTimeout(function(){Rep.iv=setInterval(function(){Rep.fired=true;doStep(st);},90);},420);
});
document.addEventListener('pointerup',stopRep);
document.addEventListener('pointercancel',stopRep);
window.addEventListener('blur',stopRep);
document.addEventListener('contextmenu',function(e){if(e.target.closest('.step'))e.preventDefault();});

document.addEventListener('click',function(e){
  resumeAudio();
  var tab=e.target.closest('[data-tab]');
  if(tab){state.ui.tab=tab.dataset.tab;state.ui.forcePicker=false;save();render();window.scrollTo(0,0);return;}
  var a=e.target.closest('[data-action]');if(!a)return;
  var act=a.dataset.action;
  if(act==='step'){
    if(Rep.fired&&Rep.el===a){Rep.fired=false;return;} /* l'appui long a déjà incrémenté */
    doStep(a);return;
  }
  if(act==='toggle-set'){
    var row2=a.closest('.set-row'),card2=a.closest('.ex-card'),exId2=card2.dataset.ex,i2=+row2.dataset.set;
    var s=state.activeWorkout.logs[exId2][i2];
    ['w','r','rir'].forEach(function(f2){var el=row2.querySelector('.val[data-field="'+f2+'"]');if(el)s[f2]=el.value;});
    s.done=!s.done;save();
    if(s.done){var ex2=EXMAP[exId2];startTimer(ex2.rest,ex2.name);doVibrate([25]);}
    render();return;
  }
  if(act==='add-set'){if(!state.activeWorkout)return;var exId3=a.closest('.ex-card').dataset.ex,arr=state.activeWorkout.logs[exId3];var last=arr[arr.length-1]||{w:'',r:''};arr.push({w:last.w||'',r:'',rir:'',done:false});save();render();return;}
  if(act==='start-session'){startWorkout(a.dataset.session);return;}
  if(act==='resume'){state.ui.forcePicker=false;save();render();window.scrollTo(0,0);return;}
  if(act==='show-picker'){state.ui.forcePicker=true;render();window.scrollTo(0,0);return;}
  if(act==='finish'){finishWorkout();return;}
  if(act==='cancel-workout'){confirmModal('Abandonner la séance en cours ? Les séries cochées ne seront pas enregistrées.','do-cancel');return;}
  if(act==='do-cancel'){closeModal();cancelWorkout();return;}
  if(act==='toggle-prog'){var id='p_'+a.dataset.ex;state.ui.openEx=(state.ui.openEx===id)?null:id;render();return;}
  if(act==='t-minus'){bumpTimer(-15);return;}
  if(act==='t-plus'){bumpTimer(15);return;}
  if(act==='t-toggle'){toggleTimer();return;}
  if(act==='t-skip'){hideTimer();return;}
  if(act==='toggle-setting'){var k=a.dataset.key;state.settings[k]=!state.settings[k];save();if(k==='keepAwake'){state.settings[k]&&state.activeWorkout?requestWake():releaseWake();}render();return;}
  if(act==='export'){doExport();return;}
  if(act==='import'){$('#importFile').click();return;}
  if(act==='reset-block'){confirmModal('Recommencer le bloc : repasse en Semaine 1 (l’historique est conservé).','do-reset-block');return;}
  if(act==='do-reset-block'){state.settings.week=1;state.settings.startDate=todayISO();save();closeModal();render();return;}
  if(act==='clear-history'){confirmModal('Effacer TOUT l’historique de tes séances ? Irréversible.','do-clear-history');return;}
  if(act==='do-clear-history'){state.history=[];save();closeModal();render();return;}
  if(act==='reset-app'){confirmModal('Tout réinitialiser (historique + réglages + séance en cours) ?','do-reset-app');return;}
  if(act==='do-reset-app'){state=defState();save();closeModal();render();return;}
  if(act==='go-progress'){closeModal();state.ui.tab='progress';save();render();window.scrollTo(0,0);return;}
  if(act==='day-info'){dayModal(a.dataset.iso);return;}
  if(act==='open-session'){var en=findHist(a.dataset.id);if(en)sessionModal(en);return;}
  if(act==='dur-minus'||act==='dur-plus'){var di=$('#durEdit');if(di){di.value=Math.max(1,Math.round(num(di.value))+(act==='dur-plus'?1:-1));}return;}
  if(act==='save-dur'){
    var enD=findHist(a.dataset.id),diS=$('#durEdit');
    if(enD&&diS){enD.durationSec=Math.max(1,Math.round(num(diS.value)))*60;save();closeModal();render();}
    return;
  }
  if(act==='ask-del-session'){confirmModal('Supprimer définitivement cette séance ? Ses séries disparaîtront de ta progression.','do-del-session',a.dataset.id);return;}
  if(act==='do-del-session'){var did=a.dataset.id;state.history=state.history.filter(function(h2){return h2.id!==did;});save();closeModal();render();return;}
  if(act==='bw-add'){bwModal();return;}
  if(act==='bw-minus'||act==='bw-plus'){var bi=$('#bwVal');if(bi){var bv=num(bi.value)+(act==='bw-plus'?0.1:-0.1);if(bv<0)bv=0;bi.value=String(+bv.toFixed(1)).replace('.',',');}return;}
  if(act==='bw-save'){
    var bi2=$('#bwVal'),wv=bi2?num(bi2.value):0;
    if(wv<25||wv>300){if(bi2){bi2.style.color='var(--red)';}return;}
    wv=+wv.toFixed(1);
    var tI=todayISO();
    state.bodyweight=(state.bodyweight||[]).filter(function(e2){return e2.d!==tI;});
    state.bodyweight.push({d:tI,w:wv});
    state.bodyweight.sort(function(x,y){return x.d<y.d?-1:1;});
    save();closeModal();render();return;
  }
  if(act==='bw-del'){var dd=a.dataset.d;state.bodyweight=(state.bodyweight||[]).filter(function(e3){return e3.d!==dd;});save();render();return;}
  if(act==='j-toggle'){state.ui.jAll=!state.ui.jAll;save();render();return;}
  if(act==='close-modal'){closeModal();return;}
  return;
});
/* seg buttons (semaine / objectif) */
document.addEventListener('click',function(e){
  var wb=e.target.closest('[data-week]');
  if(wb){state.settings.week=+wb.dataset.week;if(state.activeWorkout)state.activeWorkout.week=+wb.dataset.week;save();render();return;}
  var gb=e.target.closest('[data-goal]');
  if(gb){state.settings.goal=+gb.dataset.goal;save();render();return;}
});
$('#modal-root').addEventListener('click',function(e){if(e.target.id==='modal-root')closeModal();});

$('#importFile').addEventListener('change',function(e){
  var f=e.target.files[0];if(!f)return;var rd=new FileReader();
  rd.onload=function(){try{var d=JSON.parse(rd.result);if(d&&d.history&&d.settings){state=Object.assign(defState(),d);state.ui={tab:'progress',forcePicker:false,openEx:null,notes:{}};if(!state.settings.goal)state.settings.goal=3;save();render();modal('<h3>Importé ✅</h3><p class="muted">'+state.history.length+' séances restaurées.</p><button class="btn btn-primary btn-block" data-action="close-modal">OK</button>');}else throw 0;}catch(err){alert('Fichier invalide.');}};
  rd.readAsText(f);e.target.value='';
});
function doExport(){
  var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='muscu-sauvegarde-'+todayISO()+'.json';document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(url);a.remove();},100);
}

/* tilt 3D du hero (pointeur) */
document.addEventListener('pointermove',function(e){
  var hero=$('#heroTilt');if(!hero)return;
  var r=hero.getBoundingClientRect();
  if(e.clientY<r.top-80||e.clientY>r.bottom+80)return;
  var dx=(e.clientX-r.left)/r.width-0.5,dy=(e.clientY-r.top)/r.height-0.5;
  hero.style.transform='perspective(900px) rotateY('+(dx*3.5).toFixed(2)+'deg) rotateX('+(-dy*3).toFixed(2)+'deg)';
  window.__heroPar={x:dx,y:dy};
});
document.addEventListener('pointerleave',function(){var hero=$('#heroTilt');if(hero)hero.style.transform='';window.__heroPar={x:0,y:0};});

/* live duration ticker */
setInterval(function(){if(state.activeWorkout&&state.ui.tab==='workout'&&!state.ui.forcePicker){var el=$('#liveDur');if(el)el.textContent=fmtTime((Date.now()-state.activeWorkout.startedAt)/1000);}},1000);

$('#brandMark').innerHTML=icon('dumbbell',18,2.2);
Array.prototype.forEach.call(document.querySelectorAll('.ic-wrap'),function(el){el.innerHTML=icon(el.dataset.ic,20,1.9);});

render();

if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')&&/(index\.html|\/)$/.test(location.pathname)){

}

<script type="module">
/* ============ HERO 3D — haltère métallique (three.js, vendored) ============ */
import * as THREE from 'three';
import {RoomEnvironment} from './assets/room-env.js';
try{
  const SIZE=176;
  const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:'low-power'});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.setSize(SIZE,SIZE);
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.15;
  const scene=new THREE.Scene();
  const pmrem=new THREE.PMREMGenerator(renderer);
  scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
  const cam=new THREE.PerspectiveCamera(30,1,0.1,20);
  cam.position.set(0,0.7,6.2);cam.lookAt(0,0,0);

  const g=new THREE.Group();scene.add(g);
  const dark=new THREE.MeshStandardMaterial({color:0x17171b,metalness:0.85,roughness:0.34});
  const steel=new THREE.MeshStandardMaterial({color:0x9a9aa4,metalness:1,roughness:0.22});
  const accm=new THREE.MeshStandardMaterial({color:0xff4d00,metalness:0.35,roughness:0.32});
  function cyl(r,l,mat,x){
    const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,l,56),mat);
    m.rotation.z=Math.PI/2;m.position.x=x;g.add(m);return m;
  }
  cyl(0.115,3.2,steel,0);               // barre
  [-1,1].forEach(s=>{
    cyl(0.19,0.13,steel,s*1.02);        // collier
    cyl(0.40,0.15,dark,s*1.62);         // petit disque
    cyl(0.52,0.17,dark,s*1.45);         // disque moyen
    cyl(0.65,0.21,dark,s*1.24);         // gros disque
    const ring=new THREE.Mesh(new THREE.TorusGeometry(0.65,0.032,18,72),accm);
    ring.position.x=s*1.355;ring.rotation.y=Math.PI/2;g.add(ring); // liseré orange
    cyl(0.07,0.1,steel,s*1.72);         // embout
  });
  g.rotation.z=-0.5;g.rotation.x=0.12;g.rotation.y=0.32;
  g.scale.setScalar(0.94);

  let t=0;
  const clock=new THREE.Clock();
  renderer.setAnimationLoop(()=>{
    const holder=document.getElementById('hero3d');
    if(holder&&renderer.domElement.parentNode!==holder)holder.appendChild(renderer.domElement);
    if(!renderer.domElement.isConnected||document.hidden)return;
    const dt=Math.min(clock.getDelta(),0.05);t+=dt;
    const par=window.__heroPar||{x:0,y:0};
    /* oscille autour d'un angle qui montre barre + disques, jamais dans l'axe */
    const targetY=0.32+Math.sin(t*0.55)*0.33+par.x*0.5;
    g.rotation.y+=(targetY-g.rotation.y)*0.07;
    g.rotation.x+=((0.12+par.y*0.4)-g.rotation.x)*0.06;
    g.position.y=Math.sin(t*1.3)*0.09;
    renderer.render(scene,cam);
  });
}catch(e){/* WebGL indisponible : le hero reste propre sans 3D */}
</script>
