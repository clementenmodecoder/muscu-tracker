<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1419">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Tracker Muscu</title>
<style>
  :root{
    --bg:#0f1419; --surface:#1a2129; --surface2:#232d38; --surface3:#2c3845;
    --line:#313d49; --text:#e6edf3; --muted:#8b98a5; --muted2:#647080;
    --accent:#2ec27e; --accent-d:#249c63; --blue:#3b82f6; --amber:#f0a84a;
    --red:#ef5350; --purple:#b18cf0;
    --m-chest:#ef6f6c; --m-back:#5b9bd5; --m-delts:#f0a84a; --m-rear:#e879b9;
    --m-arms-tri:#b18cf0; --m-arms-bi:#7c9cf0; --m-legs:#4bbf8a; --m-core:#9aa7b3; --m-cuff:#43c7c2;
    --nav-h:62px; --radius:16px;
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px; line-height:1.4;
    padding-bottom:calc(var(--nav-h) + var(--safe-b) + 90px);
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:contain;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 14px;}

  /* HEADER */
  #hdr{position:sticky;top:0;z-index:40;background:rgba(15,20,25,.92);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);}
  .hdr-in{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;max-width:560px;margin:0 auto;}
  .hdr-date{font-size:13px;color:var(--muted);text-transform:capitalize;}
  .hdr-title{font-size:18px;font-weight:800;letter-spacing:-.02em;}
  .week-pill{background:var(--surface2);border:1px solid var(--line);border-radius:999px;
    padding:7px 13px;font-size:13px;font-weight:700;color:var(--accent);cursor:pointer;white-space:nowrap;}
  .week-pill b{color:var(--text);}

  /* GENERIC */
  h2{font-size:15px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px;}
  .btn{appearance:none;border:none;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer;
    padding:13px 16px;color:#fff;background:var(--surface2);transition:transform .06s,background .15s;font-family:inherit;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--accent);color:#06231a;}
  .btn-block{display:block;width:100%;}
  .btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--line);}
  .btn-danger{background:transparent;color:var(--red);border:1px solid var(--red);}
  .row{display:flex;gap:10px;}
  .muted{color:var(--muted);} .small{font-size:13px;} .center{text-align:center;}
  .hidden{display:none!important;}
  a{color:var(--blue);}

  /* SESSION PICKER */
  .pick-grid{display:grid;gap:10px;}
  .pick{display:flex;align-items:center;gap:13px;text-align:left;padding:15px;border-radius:14px;
    background:var(--surface);border:1px solid var(--line);cursor:pointer;width:100%;color:var(--text);font-family:inherit;}
  .pick:active{transform:scale(.99);}
  .pick.reco{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;}
  .pick-dot{width:12px;height:42px;border-radius:6px;flex:none;}
  .pick-main{flex:1;}
  .pick-name{font-weight:800;font-size:16px;}
  .pick-sub{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .pick-tag{font-size:11px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.04em;}
  .pick-arrow{color:var(--muted2);font-size:20px;}

  /* WARMUP BANNER */
  .banner{background:linear-gradient(135deg,#1d2a25,#1a2129);border:1px solid #2a4035;border-left:3px solid var(--accent);
    border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:13.5px;}
  .banner b{color:var(--accent);}
  .wk-note{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:14px;font-size:13px;}
  .wk-note .rir{display:inline-block;background:var(--surface3);border-radius:6px;padding:2px 8px;font-weight:800;color:var(--amber);margin-left:6px;}

  /* EXERCISE CARD */
  .ex-card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    margin-bottom:12px;overflow:hidden;}
  .ex-card.card-done{opacity:.72;}
  .ex-card.card-done .ex-bar{background:var(--accent)!important;}
  .ex-bar{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--muted2);}
  .ex-body{padding:13px 14px 13px 17px;}
  .ex-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
  .ex-title{font-weight:800;font-size:16px;letter-spacing:-.01em;}
  .ex-title .opt{font-size:10px;font-weight:800;color:var(--muted);background:var(--surface3);padding:2px 6px;border-radius:5px;margin-left:6px;vertical-align:middle;text-transform:uppercase;}
  .warn-badge{color:var(--amber);font-size:14px;}
  .ex-prog{font-variant-numeric:tabular-nums;font-weight:800;font-size:14px;color:var(--muted);background:var(--surface2);
    border-radius:8px;padding:4px 9px;white-space:nowrap;}
  .ex-prog.full{color:var(--accent);}
  .ex-meta{font-size:12.5px;color:var(--muted);margin:5px 0 2px;}
  .ex-prev{font-size:12px;color:var(--muted2);margin:6px 0 4px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .progress-badge{background:var(--accent);color:#06231a;font-weight:800;font-size:11px;padding:2px 7px;border-radius:6px;}

  /* SET ROWS */
  .sets{margin-top:10px;display:flex;flex-direction:column;gap:8px;}
  .set-row{display:grid;grid-template-columns:26px 1fr 1fr 52px 48px;gap:7px;align-items:center;
    background:var(--surface2);border-radius:11px;padding:7px;border:1px solid transparent;transition:.15s;}
  .set-row.done{background:#16291f;border-color:#27543b;}
  .set-num{width:26px;height:26px;border-radius:7px;background:var(--surface3);display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:13px;color:var(--muted);}
  .set-row.done .set-num{background:var(--accent);color:#06231a;}
  .field{display:flex;align-items:center;background:var(--surface);border-radius:9px;overflow:hidden;border:1px solid var(--line);}
  .field .step{width:30px;height:38px;border:none;background:transparent;color:var(--muted);font-size:19px;font-weight:700;cursor:pointer;flex:none;font-family:inherit;}
  .field .step:active{background:var(--surface3);}
  .field .val{width:100%;min-width:0;border:none;background:transparent;color:var(--text);text-align:center;
    font-size:16px;font-weight:700;padding:9px 0;font-family:inherit;font-variant-numeric:tabular-nums;}
  .field .val:focus{outline:none;}
  .field.rir{justify-content:center;}
  .field.rir .val{padding:9px 4px;}
  .field .unit{display:none;}
  .done-btn{width:48px;height:46px;border-radius:10px;border:none;background:var(--surface3);color:var(--muted);
    font-size:22px;font-weight:800;cursor:pointer;flex:none;}
  .set-row.done .done-btn{background:var(--accent);color:#06231a;}
  .set-labels{display:grid;grid-template-columns:26px 1fr 1fr 52px 48px;gap:7px;font-size:10px;color:var(--muted2);
    text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:0 7px;margin-bottom:-2px;}
  .set-labels span{text-align:center;}
  .add-set{margin-top:9px;width:100%;background:transparent;border:1px dashed var(--line);color:var(--muted);
    border-radius:10px;padding:9px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}

  /* NOTES */
  details.ex-notes{margin-top:11px;border-top:1px solid var(--line);padding-top:9px;}
  details.ex-notes summary{font-size:12.5px;color:var(--muted);font-weight:700;cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px;}
  details.ex-notes summary::-webkit-details-marker{display:none;}
  details.ex-notes summary::after{content:"▾";margin-left:auto;color:var(--muted2);}
  details.ex-notes[open] summary::after{content:"▴";}
  .ex-notes p{font-size:13px;margin:9px 0 0;color:var(--muted);}
  .ex-notes .amp{color:#cfe3ff;background:#16202e;border-radius:8px;padding:8px 10px;}
  .ex-notes .warn{color:#ffd9a8;background:#2a2113;border-radius:8px;padding:8px 10px;}

  /* FINISH */
  .finish-zone{margin:18px 0 8px;}
  .summary-line{display:flex;justify-content:space-between;font-size:13px;padding:6px 2px;border-bottom:1px solid var(--line);}
  .summary-line b{font-variant-numeric:tabular-nums;}

  /* TIMER BAR */
  .timerbar{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + var(--safe-b));z-index:60;
    background:var(--surface2);border-top:1px solid var(--line);padding:10px 14px;
    box-shadow:0 -8px 24px rgba(0,0,0,.4);}
  .timerbar.done{background:#16291f;}
  .tb-in{max-width:560px;margin:0 auto;}
  .tb-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;}
  .tb-ex{font-size:12.5px;color:var(--muted);font-weight:700;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tb-time{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
  .timerbar.done .tb-time{color:var(--accent);}
  .tb-track{height:5px;background:var(--surface);border-radius:3px;overflow:hidden;margin-bottom:9px;}
  .tb-fill{height:100%;background:var(--accent);width:100%;transition:width .25s linear;}
  .tb-btns{display:flex;gap:7px;}
  .tb-btns button{flex:1;background:var(--surface);border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:9px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
  .tb-btns .tb-skip{flex:1.3;color:var(--muted);}
  .tb-btns .tb-toggle{background:var(--accent);color:#06231a;border-color:var(--accent);}

  /* NAV */
  #nav{position:fixed;left:0;right:0;bottom:0;z-index:70;background:rgba(20,26,32,.96);backdrop-filter:blur(10px);
    border-top:1px solid var(--line);display:flex;height:var(--nav-h);padding-bottom:var(--safe-b);}
  .nav-btn{flex:1;background:none;border:none;color:var(--muted2);display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:3px;font-size:10.5px;font-weight:700;cursor:pointer;font-family:inherit;padding-top:6px;}
  .nav-btn .ic{font-size:21px;line-height:1;}
  .nav-btn.active{color:var(--accent);}

  /* PROGRESS */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:6px;}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:12px 8px;text-align:center;}
  .stat .v{font-size:22px;font-weight:800;line-height:1;}
  .stat .l{font-size:10.5px;color:var(--muted);margin-top:5px;text-transform:uppercase;letter-spacing:.03em;}
  .pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden;}
  .pcard-head{display:flex;align-items:center;gap:11px;padding:13px;cursor:pointer;}
  .pcard-info{flex:1;min-width:0;}
  .pcard-name{font-weight:800;font-size:14.5px;}
  .pcard-sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .spark{flex:none;}
  .pcard-best{text-align:right;flex:none;}
  .pcard-best .v{font-weight:800;font-size:16px;color:var(--accent);}
  .pcard-best .l{font-size:10px;color:var(--muted);}
  .pcard-detail{border-top:1px solid var(--line);padding:11px 13px;font-size:13px;}
  .htable{width:100%;border-collapse:collapse;font-size:12.5px;}
  .htable td{padding:6px 4px;border-bottom:1px solid var(--line);}
  .htable td:first-child{color:var(--muted);white-space:nowrap;}
  .htable td:last-child{text-align:right;font-variant-numeric:tabular-nums;}
  .pr-tag{color:var(--amber);font-weight:800;}

  /* PROGRAM REF */
  .prog-sess{margin-bottom:8px;}
  .ex-line{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
  .ex-line:last-child{border-bottom:none;}
  .ex-line .n{font-weight:700;}
  .ex-line .d{color:var(--muted);font-size:12px;text-align:right;white-space:nowrap;flex:none;}
  .info-block{font-size:13.5px;}
  .info-block p{margin:8px 0;}
  .info-block ul{margin:8px 0;padding-left:18px;}
  .info-block li{margin:5px 0;}
  .ptable{width:100%;border-collapse:collapse;font-size:12.5px;margin:8px 0;}
  .ptable th,.ptable td{border:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top;}
  .ptable th{background:var(--surface2);font-size:11px;text-transform:uppercase;color:var(--muted);}

  /* SETTINGS */
  .seg{display:flex;gap:7px;}
  .seg button{flex:1;background:var(--surface2);border:1px solid var(--line);color:var(--text);border-radius:10px;
    padding:11px 4px;font-weight:800;cursor:pointer;font-family:inherit;}
  .seg button.on{background:var(--accent);color:#06231a;border-color:var(--accent);}
  .set-toggle{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line);}
  .set-toggle:last-child{border-bottom:none;}
  .switch{width:50px;height:30px;border-radius:999px;background:var(--surface3);position:relative;cursor:pointer;flex:none;transition:.2s;border:none;}
  .switch.on{background:var(--accent);}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;}
  .switch.on::after{left:23px;}

  /* MODAL */
  #modal-root{position:fixed;inset:0;z-index:200;display:none;align-items:flex-end;justify-content:center;
    background:rgba(0,0,0,.6);backdrop-filter:blur(3px);}
  #modal-root.show{display:flex;}
  .modal{background:var(--surface);border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:560px;
    padding:20px 18px calc(24px + var(--safe-b));animation:up .25s ease;}
  @keyframes up{from{transform:translateY(40px);opacity:.6;}to{transform:translateY(0);opacity:1;}}
  .modal h3{margin:0 0 4px;font-size:20px;}
  .pr-list{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0;}
  .pr-chip{background:#2a2113;color:var(--amber);border-radius:8px;padding:6px 10px;font-size:12.5px;font-weight:700;}

  #errbar{position:fixed;top:0;left:0;right:0;background:var(--red);color:#fff;padding:8px;font-size:12px;z-index:999;text-align:center;}
</style>
</head>
<body>
  <header id="hdr"><div class="hdr-in">
    <div><div class="hdr-date" id="hdrDate">—</div><div class="hdr-title">Ma séance</div></div>
    <button class="week-pill" data-tab="settings" id="weekPill">Bloc · <b>S1</b></button>
  </div></header>

  <main><div class="wrap" id="view"></div></main>

  <div class="timerbar hidden" id="timerbar"><div class="tb-in">
    <div class="tb-top"><div class="tb-ex" id="tbEx">Repos</div><div class="tb-time" id="tbTime">00:00</div></div>
    <div class="tb-track"><div class="tb-fill" id="tbFill"></div></div>
    <div class="tb-btns">
      <button data-action="t-minus">−15s</button>
      <button class="tb-toggle" data-action="t-toggle" id="tbToggle">⏸</button>
      <button data-action="t-plus">+15s</button>
      <button class="tb-skip" data-action="t-skip">Passer ✕</button>
    </div>
  </div></div>

  <nav id="nav">
    <button class="nav-btn" data-tab="workout"><span class="ic">🏋️</span>Séance</button>
    <button class="nav-btn" data-tab="progress"><span class="ic">📈</span>Progrès</button>
    <button class="nav-btn" data-tab="program"><span class="ic">📋</span>Programme</button>
    <button class="nav-btn" data-tab="settings"><span class="ic">⚙️</span>Réglages</button>
  </nav>

  <div id="modal-root"></div>
  <input type="file" id="importFile" accept="application/json,.json" class="hidden">

<script>
(function(){
"use strict";
window.onerror=function(m){var e=document.getElementById('errbar');if(!e){e=document.createElement('div');e.id='errbar';document.body.appendChild(e);}e.textContent='Erreur: '+m;};

/* ============ PROGRAMME (v2, basé sur la deep research) ============ */
function ex(o){return Object.assign({sets:3,repMin:8,repMax:12,unit:'reps',load:'RIR 3',rest:90,cue:'',shoulder:false,prehab:false,optional:false,amp:'',warn:''},o);}
var CUFF=ex({id:'cuff',name:'Rotation externe poulie + serviette',muscle:'cuff',sets:2,repMin:15,repMax:15,load:'2-4 kg',rest:45,prehab:true,shoulder:true,
  cue:'Coiffe : recentre la tête humérale (objectif n°1 de ton épaule).',
  amp:'Coude collé au flanc (serviette = 20-30° d’abduction), rotation 45-60°.',warn:'Doit rester indolore. Toute douleur → allège.'});
function cuff(idp){var c=Object.assign({},CUFF);c.id=idp+'_cuff';return c;}

var PROGRAM={
  sessions:[
    {id:'hautA',day:1,name:'Haut A — Poussée',focus:'Pecs · Épaules · Triceps',color:'#ef6f6c',ex:[
      cuff('a'),
      ex({id:'a_pushupplus',name:'Push-Up Plus',muscle:'cuff',sets:2,repMin:10,repMax:12,load:'PdC',rest:60,prehab:true,shoulder:true,
        cue:'Dentelé antérieur → anti-winging, stabilité scapulaire.',amp:'En haut, protracte (éloigne bien les omoplates).',warn:'Pas de décollement d’omoplate (winging).'}),
      ex({id:'a_floor',name:'DB Floor Press',muscle:'chest',sets:4,repMin:8,repMax:12,load:'12 kg/main',rest:150,shoulder:true,
        cue:'Pecs ; le sol stoppe l’extension d’épaule = anti-translation antérieure.',amp:'Coudes s’arrêtent au sol, jamais sous le torse.',warn:'Douleur antérieure / sensation de glissement → stop.'}),
      ex({id:'a_ohp',name:'Développé épaules machine (prise neutre)',muscle:'delts',sets:3,repMin:10,repMax:12,rest:120,shoulder:true,
        cue:'Deltoïdes ; machine = trajectoire guidée, sûre en solo.',amp:'Du niveau clavicule (butée) à quasi-extension. Prise neutre.',warn:'Clic/clunk, instabilité, appréhension en bas → stop.'}),
      ex({id:'a_scaption',name:'Scaption haltères (30°)',muscle:'delts',sets:3,repMin:12,repMax:15,load:'5-7 kg',rest:90,shoulder:true,
        cue:'Deltoïde latéral dans le plan scapulaire.',amp:'≤ 90°, bras 30° en avant du plan frontal, pouces légèrement hauts.',warn:'Pincement au sommet → baisse hauteur + charge.'}),
      ex({id:'a_pushdown',name:'Extension triceps poulie',muscle:'arms-tri',sets:3,repMin:10,repMax:15,rest:90,cue:'Triceps, 0 stress gléno-huméral.'}),
      ex({id:'a_facepull',name:'Face pull',muscle:'rear',sets:2,repMin:15,repMax:20,load:'léger',rest:60,shoulder:true,
        cue:'Deltoïde post. + coiffe (santé épaule).',amp:'Tire au niveau du front, coudes hauts, rotation externe.',warn:'Éviter les à-coups / l’hyperextension arrière.'}),
    ]},
    {id:'pull',day:3,name:'Tirage + Jambes',focus:'Dos · Biceps · Jambes (MV) · Coiffe',color:'#5b9bd5',ex:[
      cuff('p'),
      ex({id:'p_pulldown',name:'Lat pulldown prise neutre (pause iso 1-2s)',muscle:'back',sets:3,repMin:8,repMax:12,rest:150,
        cue:'Dos ; pause iso en bas = phase 1 progression traction.'}),
      ex({id:'p_row',name:'Chest-supported row (banc 45°)',muscle:'back',sets:3,repMin:10,repMax:12,rest:120,cue:'Dos épais/rhomboïdes ; appui sternal = 0 triche lombaire.'}),
      ex({id:'p_legpress',name:'Presse à cuisses',muscle:'legs',sets:3,repMin:10,repMax:12,load:'60-80 kg',rest:120,cue:'Quads/fessiers — volume de maintien (MV).'}),
      ex({id:'p_legcurl',name:'Leg curl',muscle:'legs',sets:2,repMin:10,repMax:12,rest:90,cue:'Ischios — équilibre du genou.'}),
      ex({id:'p_curl',name:'Curl biceps haltères',muscle:'arms-bi',sets:3,repMin:10,repMax:12,load:'8-10 kg',rest:90,cue:'Biceps, fort rendement.'}),
      ex({id:'p_calf',name:'Mollets',muscle:'legs',sets:3,repMin:15,repMax:20,rest:60,cue:'Faible fatigue systémique.'}),
      ex({id:'p_yt',name:'Prone Y-T (banc incliné)',muscle:'rear',sets:2,repMin:12,repMax:15,load:'léger',rest:60,optional:true,shoulder:true,
        cue:'Trapèze inférieur / rhomboïdes (option santé scapulaire).',amp:'Mouvement court et contrôlé, omoplates qui descendent.',warn:'Pas de cambrure lombaire ; charge légère.'}),

var EXMAP={},SESSMAP={};
PROGRAM.sessions.forEach(function(s){SESSMAP[s.id]=s;s.ex.forEach(function(e){EXMAP[e.id]=e;});});
var MUSCLES={chest:'Pecs',back:'Dos',delts:'Épaules',rear:'Delt. post./coiffe','arms-tri':'Triceps','arms-bi':'Biceps',legs:'Jambes',core:'Core',cuff:'Coiffe/dentelé'};

/* ============ STATE ============ */
var KEY='muscu_tracker_v1', state;
function defState(){return {settings:{week:1,sound:true,vibrate:true,keepAwake:true,startDate:todayISO()},activeWorkout:null,history:[],ui:{tab:'workout',forcePicker:false,openEx:null}};}
function load(){try{var r=localStorage.getItem(KEY);state=r?JSON.parse(r):defState();}catch(e){state=defState();}
  if(!state.settings)state.settings=defState().settings; if(!state.ui)state.ui={tab:'workout',forcePicker:false,openEx:null};
  if(!state.history)state.history=[];}
var saveT;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function saveSoon(){clearTimeout(saveT);saveT=setTimeout(save,400);}

/* ============ HELPERS ============ */
function $(s,r){return (r||document).querySelector(s);}
function todayISO(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function pad(n){return n<10?'0'+n:''+n;}
function num(v){if(v==null)return 0;var n=parseFloat(String(v).replace(',','.'));return isNaN(n)?0:n;}
function fmtTime(s){s=Math.max(0,Math.round(s));return pad(Math.floor(s/60))+':'+pad(s%60);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function extractNum(load){if(!load)return '';if(/rir|pdc|léger|leger|modéré|modere/i.test(load))return '';var m=load.match(/\d+([.,]\d+)?/);return m?String(num(m[0])):'';}
function dateLabel(iso){var d=new Date(iso+'T12:00');return d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});}
function daysAgo(iso){var a=new Date(iso+'T12:00'),b=new Date(todayISO()+'T12:00');var d=Math.round((b-a)/86400000);return d<=0?'aujourd’hui':d===1?'hier':'il y a '+d+'j';}
function recoSessionId(){var m={1:'hautA',3:'pull',5:'hautB'};return m[new Date().getDay()]||null;}

function lastPerf(exId){for(var i=state.history.length-1;i>=0;i--){var h=state.history[i],arr=h.logs[exId];if(arr){var done=arr.filter(function(s){return s.done&&String(s.r)!=='';});if(done.length)return {date:h.dateISO,sets:done};}}return null;}
function histFor(exId){var out=[];state.history.forEach(function(h){var arr=h.logs[exId];if(arr){var done=arr.filter(function(s){return s.done&&String(s.r)!=='';});if(done.length)out.push({date:h.dateISO,sets:done});}});return out;}
function bestWeight(exId,before){var m=0;state.history.forEach(function(h){if(before&&h.dateISO>=before)return;(h.logs[exId]||[]).forEach(function(s){if(s.done)m=Math.max(m,num(s.w));});});return m;}
function e1rm(w,r){return w*(1+r/30);}

/* ============ WORKOUT LIFECYCLE ============ */
function startWorkout(sid){
  var s=SESSMAP[sid];if(!s)return;
  var logs={};
  s.ex.forEach(function(e){
    var lp=lastPerf(e.id),arr=[];
    for(var i=0;i<e.sets;i++){
      var w='',r='';
      if(lp){var ls=lp.sets[i]||lp.sets[lp.sets.length-1];if(ls){w=ls.w||'';r=ls.r||'';}}
      if(w===''||w==null)w=extractNum(e.load);
      if(r===''||r==null)r=String(e.repMin);
      arr.push({w:String(w),r:String(r),rir:'',done:false});
    }
    logs[e.id]=arr;
  });
  state.activeWorkout={sessionId:sid,dateISO:todayISO(),week:state.settings.week,startedAt:Date.now(),logs:logs};
  state.ui.forcePicker=false;state.ui.tab='workout';
  save();requestWake();render();
}
function finishWorkout(){
  var w=state.activeWorkout;if(!w)return;
  var sess=SESSMAP[w.sessionId];
  var setsDone=0,vol=0,prs=[];
  sess.ex.forEach(function(e){
    var prev=bestWeight(e.id,w.dateISO),maxW=0;
    (w.logs[e.id]||[]).forEach(function(s){if(s.done){setsDone++;vol+=num(s.w)*num(s.r);maxW=Math.max(maxW,num(s.w));}});
    if(maxW>0&&prev>0&&maxW>prev)prs.push(e.name+' '+maxW+'kg');
  });
  var dur=Math.round((Date.now()-w.startedAt)/1000);
  state.history.push({id:'h'+Date.now(),sessionId:w.sessionId,dateISO:w.dateISO,week:w.week,durationSec:dur,logs:w.logs});
  state.activeWorkout=null;releaseWake();save();
  showSummary({name:sess.name,dur:dur,setsDone:setsDone,vol:Math.round(vol),prs:prs});
}
function cancelWorkout(){state.activeWorkout=null;state.ui.forcePicker=false;releaseWake();save();render();}

/* ============ RENDER ============ */
function render(){
  var d=new Date();$('#hdrDate').textContent=d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
  $('#weekPill').innerHTML='Bloc · <b>S'+state.settings.week+'</b>';
  Array.prototype.forEach.call(document.querySelectorAll('.nav-btn'),function(b){b.classList.toggle('active',b.dataset.tab===state.ui.tab);});
  var v=$('#view');
  if(state.ui.tab==='workout')v.innerHTML=viewWorkout();
  else if(state.ui.tab==='progress')v.innerHTML=viewProgress();
  else if(state.ui.tab==='program')v.innerHTML=viewProgram();
  else v.innerHTML=viewSettings();
  if(state.ui.tab==='settings')bindSettings();
}

function viewWorkout(){
  var w=state.activeWorkout;
  if(!w||state.ui.forcePicker)return viewPicker();
  var sess=SESSMAP[w.sessionId],wk=PROGRAM.weeks[w.week]||PROGRAM.weeks[1];
  var h='';
  h+='<div class="banner">🔥 <b>Échauffement :</b> 5 min cardio + la 1ʳᵉ ligne coiffe + 1-2 séries de montée en charge sur le 1ᵉʳ gros mouvement. Tempo : excentrique 2-4s, jamais d’élan.</div>';
  h+='<div class="wk-note"><b>'+esc(sess.name)+'</b> · '+esc(sess.focus)+'<br><span class="muted">'+esc(wk.label)+'<span class="rir">'+esc(wk.rir)+'</span></span><br><span class="muted small">'+esc(wk.note)+'</span></div>';
  sess.ex.forEach(function(e){h+=exCard(e,w.logs[e.id]);});
  // finish
  var done=0,total=0,vol=0;
  sess.ex.forEach(function(e){(w.logs[e.id]||[]).forEach(function(s){total++;if(s.done){done++;vol+=num(s.w)*num(s.r);}});});
  h+='<div class="finish-zone">';
  h+='<div class="card"><div class="summary-line"><span class="muted">Séries faites</span><b>'+done+' / '+total+'</b></div>'+
     '<div class="summary-line"><span class="muted">Volume</span><b>'+Math.round(vol)+' kg</b></div>'+
     '<div class="summary-line" style="border:none"><span class="muted">Durée</span><b id="liveDur">'+fmtTime((Date.now()-w.startedAt)/1000)+'</b></div></div>';
  h+='<button class="btn btn-primary btn-block" data-action="finish">✅ Terminer la séance</button>';
  h+='<button class="btn btn-ghost btn-block" style="margin-top:8px" data-action="show-picker">Changer de séance</button>';
  h+='</div>';
  return h;
}
function exCard(e,logs){
  logs=logs||[];
  var done=logs.filter(function(s){return s.done;}).length,full=done>0&&done>=logs.length;
  var color='var(--m-'+e.muscle+')';
  var unit=e.unit==='s'?'s':'';
  var lp=lastPerf(e.id),prev='',ready=false;
  if(lp){
    var summ=lp.sets.map(function(s){return s.r+(unit);}).join(',');
    var ws=lp.sets[0]?lp.sets[0].w:'';
    prev='Dernière fois ('+daysAgo(lp.date)+') : '+(ws?ws+'kg × ':'')+summ;
    ready=lp.sets.every(function(s){return num(s.r)>=e.repMax;});
  }else prev='Première fois — note tes charges 💪';
  var h='<div class="ex-card '+(full?'card-done':'')+'" data-ex="'+e.id+'"><div class="ex-bar" style="background:'+color+'"></div><div class="ex-body">';
  h+='<div class="ex-head"><div class="ex-title">'+(e.shoulder?'<span class="warn-badge">⚠</span> ':'')+esc(e.name)+(e.optional?'<span class="opt">option</span>':'')+'</div>';
  h+='<div class="ex-prog '+(full?'full':'')+'">'+done+'/'+logs.length+'</div></div>';
  h+='<div class="ex-meta">'+e.sets+' × '+e.repMin+'-'+e.repMax+unit+' · '+esc(e.load)+' · repos '+fmtTime(e.rest)+'</div>';
  h+='<div class="ex-prev">'+esc(prev)+(ready?' <span class="progress-badge">↑ prêt à monter</span>':'')+'</div>';
  h+='<div class="set-labels"><span>#</span><span>'+(e.unit==='s'?'charge':'kg')+'</span><span>'+(e.unit==='s'?'sec':'reps')+'</span><span>RIR</span><span>ok</span></div>';
  h+='<div class="sets">';
  logs.forEach(function(s,i){h+=setRow(e,i,s);});
  h+='</div><button class="add-set" data-action="add-set">+ ajouter une série</button>';
  h+='<details class="ex-notes"'+(state.ui.openEx===e.id?' open':'')+'><summary>ℹ️ Notes'+(e.shoulder?' · ⚠ épaule':'')+'</summary>';
  if(e.cue)h+='<p>'+esc(e.cue)+'</p>';
  if(e.shoulder){if(e.amp)h+='<p class="amp"><b>Amplitude :</b> '+esc(e.amp)+'</p>';if(e.warn)h+='<p class="warn"><b>⚠ Stop si :</b> '+esc(e.warn)+'</p>';}
  h+='</details></div></div>';
  return h;
}
function setRow(e,i,s){
  return '<div class="set-row '+(s.done?'done':'')+'" data-set="'+i+'">'+
    '<div class="set-num">'+(i+1)+'</div>'+
    '<div class="field"><button class="step" data-action="step" data-field="w" data-step="-1">−</button>'+
      '<input class="val" inputmode="decimal" data-field="w" value="'+esc(s.w)+'"><button class="step" data-action="step" data-field="w" data-step="1">+</button></div>'+
    '<div class="field"><button class="step" data-action="step" data-field="r" data-step="-1">−</button>'+
      '<input class="val" inputmode="numeric" data-field="r" value="'+esc(s.r)+'"><button class="step" data-action="step" data-field="r" data-step="1">+</button></div>'+
    '<div class="field rir"><input class="val" inputmode="numeric" data-field="rir" value="'+esc(s.rir)+'" placeholder="–"></div>'+
    '<button class="done-btn" data-action="toggle-set">✓</button></div>';
}

function viewPicker(){
  var reco=recoSessionId();
  var h='';
  if(reco)h+='<div class="banner">📅 Aujourd’hui (recommandé) : <b>'+esc(SESSMAP[reco].name)+'</b></div>';
  else h+='<div class="banner">📅 Pas de séance prévue aujourd’hui (jour de repos). Tu peux quand même en lancer une.</div>';

      (s.id===reco?'<span class="pick-tag">aujourd’hui</span>':(s.optional?'<span class="pick-tag" style="color:var(--purple)">option</span>':''))+
      '<span class="pick-arrow">›</span></button>';
  });

  if(state.activeWorkout)h+='<button class="btn btn-ghost btn-block" style="margin-top:14px" data-action="resume">↩︎ Reprendre la séance en cours</button>';

}

/* ===== PROGRESS ===== */
function viewProgress(){
  var hist=state.history;
  var weekCount=hist.filter(function(h){return daysAgoNum(h.dateISO)<7;}).length;
  var totVol=0;hist.forEach(function(h){Object.keys(h.logs).forEach(function(k){h.logs[k].forEach(function(s){if(s.done)totVol+=num(s.w)*num(s.r);});});});
  var h='<div class="stats">'+
    '<div class="stat"><div class="v">'+hist.length+'</div><div class="l">Séances</div></div>'+
    '<div class="stat"><div class="v">'+weekCount+'</div><div class="l">Cette semaine</div></div>'+
    '<div class="stat"><div class="v">'+kfmt(totVol)+'</div><div class="l">Volume total</div></div></div>';
  if(!hist.length)return h+'<div class="card center muted" style="margin-top:14px">Aucune séance enregistrée.<br>Termine ta 1ʳᵉ séance pour voir ta progression 📈</div>';
  // collect exercises with history, ordered by muscle then most recent
  var ids=[];Object.keys(EXMAP).forEach(function(id){if(histFor(id).length)ids.push(id);});
  ids.sort(function(a,b){return EXMAP[a].muscle.localeCompare(EXMAP[b].muscle);});
  h+='<h2>Progression par exercice</h2>';
  ids.forEach(function(id){h+=progCard(id);});
  return h;
}
function progCard(id){
  var e=EXMAP[id],hs=histFor(id),open=state.ui.openEx==='p_'+id;
  var weighted=hs.some(function(en){return en.sets.some(function(s){return num(s.w)>0;});});
  var vals=hs.map(function(en){var m=0;en.sets.forEach(function(s){var v=weighted?e1rm(num(s.w),num(s.r)):num(s.r);if(v>m)m=v;});return m;});
  var best=0,bestRaw=0;hs.forEach(function(en){en.sets.forEach(function(s){if(weighted){if(num(s.w)>bestRaw)bestRaw=num(s.w);}else{if(num(s.r)>bestRaw)bestRaw=num(s.r);}});});
  var bestLabel=weighted?(bestRaw+' kg'):(bestRaw+(e.unit==='s'?' s':' reps'));
  var last=hs[hs.length-1];
  var lastTxt=last?(daysAgo(last.date)):'';
  var h='<div class="pcard"><div class="pcard-head" data-action="toggle-prog" data-ex="'+id+'">'+
    '<div class="pcard-info"><div class="pcard-name">'+esc(e.name)+'</div><div class="pcard-sub">'+MUSCLES[e.muscle]+' · '+hs.length+' séances · '+lastTxt+'</div></div>'+
    spark(vals)+
    '<div class="pcard-best"><div class="v">'+bestLabel+'</div><div class="l">record</div></div></div>';
  if(open){
    h+='<div class="pcard-detail"><table class="htable">';
    for(var i=hs.length-1;i>=0;i--){var en=hs[i];
      var sets=en.sets.map(function(s){return (num(s.w)>0?s.w+'×':'')+s.r+(e.unit==='s'?'s':'');}).join('  ');
      var topw=0;en.sets.forEach(function(s){topw=Math.max(topw,num(s.w));});
      var pr=(weighted&&topw>0&&topw>=bestRaw&&i===lastIndexOfMax(hs,weighted));
      h+='<tr><td>'+new Date(en.date+'T12:00').toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'})+'</td><td style="color:var(--text)">'+esc(sets)+(pr?' <span class="pr-tag">★</span>':'')+'</td></tr>';
    }
    h+='</table></div>';
  }
  h+='</div>';return h;
}
function lastIndexOfMax(hs,weighted){var mx=-1,idx=0;hs.forEach(function(en,i){var t=0;en.sets.forEach(function(s){t=Math.max(t,weighted?num(s.w):num(s.r));});if(t>=mx){mx=t;idx=i;}});return idx;}
function spark(vals){
  var w=72,hh=34,p=4;if(!vals.length)return '<svg class="spark" width="'+w+'" height="'+hh+'"></svg>';
  if(vals.length===1)return '<svg class="spark" width="'+w+'" height="'+hh+'"><circle cx="'+(w/2)+'" cy="'+(hh/2)+'" r="3" fill="var(--accent)"/></svg>';
  var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),rng=(mx-mn)||1;
  var pts=vals.map(function(v,i){var x=p+i*(w-2*p)/(vals.length-1);var y=hh-p-((v-mn)/rng)*(hh-2*p);return x.toFixed(1)+','+y.toFixed(1);});
  var up=vals[vals.length-1]>=vals[0];
  return '<svg class="spark" width="'+w+'" height="'+hh+'"><polyline fill="none" stroke="'+(up?'var(--accent)':'var(--amber)')+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="'+pts.join(' ')+'"/></svg>';
}
function daysAgoNum(iso){return Math.round((new Date(todayISO()+'T12:00')-new Date(iso+'T12:00'))/86400000);}
function kfmt(n){n=Math.round(n);return n>=1000?(n/1000).toFixed(1).replace('.0','')+'k':''+n;}

    h+='</div>';
  });
  h+='<h2>Progression 4 semaines</h2><div class="card info-block"><table class="ptable"><tr><th>Sem.</th><th>Effort</th><th>Consigne</th></tr>';
  [1,2,3,4].forEach(function(n){var w=PROGRAM.weeks[n];h+='<tr><td><b>S'+n+'</b></td><td>'+esc(w.rir)+'</td><td>'+esc(w.note)+'</td></tr>';});
  h+='</table><p><b>Double progression :</b> garde la charge tant que tu n’as pas atteint le haut de la fourchette sur TOUTES les séries en technique propre. Ensuite seulement : +charge (haut +1-2,5 kg · jambes +2,5-5 · épaules +0,5-1 kg ou reps). Épaule : jamais sacrifier l’amplitude pour du poids.</p></div>';
  h+='<h2>Tractions — progression clinique</h2><div class="card info-block"><ul>'+
    '<li><b>S1-4 (maintenant) :</b> lat pulldown prise neutre + pause iso 1-2s.</li>'+
    '<li><b>S5-8 :</b> excentriques lents 3-4s.</li>'+
    '<li><b>S9+ :</b> tractions assistées (machine/élastique), délestage 50-70%.</li>'+
    '<li>Puis tractions strictes — jamais de dead hang relâché, jamais larges/kipping.</li></ul>'+
    '<p><b>Dips → interdits</b> (extension d’épaule extrême). Remplacés par pushdowns + close-grip floor press.</p></div>';
  return h;
}

/* ===== SETTINGS ===== */
function viewSettings(){
  var st=state.settings;
  var h='<h2>Semaine du bloc</h2><div class="card"><div class="seg" id="weekSeg">';
  [1,2,3,4].forEach(function(n){h+='<button class="'+(st.week===n?'on':'')+'" data-week="'+n+'">S'+n+'</button>';});
  h+='</div><p class="muted small" style="margin:10px 0 0">'+esc(PROGRAM.weeks[st.week].note)+'</p></div>';
  h+='<h2>Pendant la séance</h2><div class="card">'+
    toggleRow('🔊 Son fin de repos','sound',st.sound)+
    toggleRow('📳 Vibration','vibrate',st.vibrate)+
    toggleRow('☀️ Garder l’écran allumé','keepAwake',st.keepAwake)+'</div>';
  h+='<h2>Mes données</h2><div class="card">'+
    '<button class="btn btn-ghost btn-block" data-action="export">⬇️ Exporter (sauvegarde JSON)</button>'+
    '<button class="btn btn-ghost btn-block" style="margin-top:9px" data-action="import">⬆️ Importer une sauvegarde</button>'+
    '<p class="muted small" style="margin:11px 0 0">Tes données sont stockées sur cet appareil/navigateur uniquement. Exporte régulièrement pour ne rien perdre.</p></div>';
  h+='<h2>Zone risquée</h2><div class="card">'+
    '<button class="btn btn-ghost btn-block" data-action="reset-block">🔄 Recommencer le bloc (→ S1, aujourd’hui)</button>'+
    '<button class="btn btn-danger btn-block" style="margin-top:9px" data-action="clear-history">🗑️ Effacer l’historique</button>'+
    '<button class="btn btn-danger btn-block" style="margin-top:9px" data-action="reset-app">⚠️ Tout réinitialiser</button></div>';
  h+='<p class="muted small center" style="margin:18px 0 4px">Tracker Muscu · données locales · v1</p>';
  return h;
}
function toggleRow(label,key,on){return '<div class="set-toggle"><span>'+label+'</span><button class="switch '+(on?'on':'')+'" data-action="toggle-setting" data-key="'+key+'"></button></div>';}
function bindSettings(){}

/* ===== MODAL ===== */
function showSummary(d){
  var prs=d.prs.length?'<div class="pr-list">'+d.prs.map(function(p){return '<span class="pr-chip">🏆 '+esc(p)+'</span>';}).join('')+'</div>':'<p class="muted">Pas de record aujourd’hui — la régularité paie 💪</p>';
  modal('<h3>Séance terminée 🎉</h3><p class="muted">'+esc(d.name)+'</p>'+
    '<div style="margin:14px 0"><div class="summary-line"><span class="muted">Durée</span><b>'+fmtTime(d.dur)+'</b></div>'+
    '<div class="summary-line"><span class="muted">Séries</span><b>'+d.setsDone+'</b></div>'+
    '<div class="summary-line" style="border:none"><span class="muted">Volume soulevé</span><b>'+d.vol+' kg</b></div></div>'+
    '<b>Records :</b>'+prs+
    '<button class="btn btn-primary btn-block" style="margin-top:8px" data-action="go-progress">Voir ma progression</button>'+
    '<button class="btn btn-ghost btn-block" style="margin-top:8px" data-action="close-modal">Fermer</button>');
}
function confirmModal(msg,actionYes){
  modal('<h3>Confirmer</h3><p class="muted">'+esc(msg)+'</p>'+
    '<button class="btn btn-danger btn-block" style="margin-top:6px" data-action="'+actionYes+'">Oui, continuer</button>'+
    '<button class="btn btn-ghost btn-block" style="margin-top:8px" data-action="close-modal">Annuler</button>');
}
function modal(html){var r=$('#modal-root');r.innerHTML='<div class="modal">'+html+'</div>';r.classList.add('show');}
function closeModal(){$('#modal-root').classList.remove('show');$('#modal-root').innerHTML='';}

/* ============ REST TIMER ============ */
var Timer={total:0,remaining:0,running:false,endAt:0,iv:null,done:false,label:''};
function startTimer(sec,label){
  if(!sec){return;}
  Timer.total=sec;Timer.remaining=sec;Timer.endAt=Date.now()+sec*1000;Timer.running=true;Timer.done=false;Timer.label=label||'Repos';
  $('#timerbar').classList.remove('hidden','done');$('#tbToggle').textContent='⏸';
  paintTimer();clearInterval(Timer.iv);Timer.iv=setInterval(tickTimer,200);
}
function tickTimer(){
  if(!Timer.running)return;
  var rem=Math.round((Timer.endAt-Date.now())/1000);Timer.remaining=Math.max(0,rem);paintTimer();
  if(rem<=0){Timer.running=false;Timer.done=true;clearInterval(Timer.iv);$('#timerbar').classList.add('done');$('#tbEx').textContent='Repos terminé — c’est reparti !';beepEnd();doVibrate([300,120,300,120,300]);setTimeout(function(){if(Timer.done)hideTimer();},5000);}
}
function paintTimer(){
  $('#tbTime').textContent=fmtTime(Timer.remaining);
  if(!Timer.done)$('#tbEx').textContent='Repos · '+Timer.label;
  var pct=Timer.total?Math.max(0,Math.min(100,(Timer.remaining/Timer.total)*100)):0;$('#tbFill').style.width=pct+'%';
}
function hideTimer(){Timer.running=false;clearInterval(Timer.iv);$('#timerbar').classList.add('hidden');Timer.done=false;}
function toggleTimer(){if(Timer.done)return;if(Timer.running){Timer.running=false;$('#tbToggle').textContent='▶';}else{Timer.running=true;Timer.endAt=Date.now()+Timer.remaining*1000;$('#tbToggle').textContent='⏸';}}
function bumpTimer(d){Timer.remaining=Math.max(0,Timer.remaining+d);if(Timer.remaining>Timer.total)Timer.total=Timer.remaining;Timer.endAt=Date.now()+Timer.remaining*1000;if(Timer.done&&Timer.remaining>0){Timer.done=false;Timer.running=true;$('#timerbar').classList.remove('done');$('#tbToggle').textContent='⏸';}paintTimer();}

/* AUDIO + VIBRATE + WAKELOCK */
var actx=null;
function resumeAudio(){try{if(!actx){var C=window.AudioContext||window.webkitAudioContext;if(C)actx=new C();}if(actx&&actx.state==='suspended')actx.resume();}catch(e){}}
function beep(freq,start,dur){var o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);o.type='sine';o.frequency.value=freq;var t=actx.currentTime+start;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.35,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.start(t);o.stop(t+dur+.02);}
function beepEnd(){if(!state.settings.sound)return;try{resumeAudio();if(!actx)return;beep(880,0,.18);beep(880,.22,.18);beep(1175,.44,.30);}catch(e){}}
function doVibrate(p){if(!state.settings.vibrate)return;try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}
var wakeLock=null;
function requestWake(){if(!state.settings.keepAwake)return;try{if('wakeLock'in navigator)navigator.wakeLock.request('screen').then(function(w){wakeLock=w;}).catch(function(){});}catch(e){}}
function releaseWake(){try{if(wakeLock){wakeLock.release();wakeLock=null;}}catch(e){}}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&state.activeWorkout&&state.settings.keepAwake)requestWake();});

/* ============ EVENTS ============ */
document.addEventListener('input',function(e){
  var inp=e.target.closest('.val');if(!inp)return;
  var row=inp.closest('.set-row');if(!row||!state.activeWorkout)return;
  var card=inp.closest('.ex-card'),exId=card.dataset.ex,i=+row.dataset.set,f=inp.dataset.field;
  if(state.activeWorkout.logs[exId]&&state.activeWorkout.logs[exId][i]){state.activeWorkout.logs[exId][i][f]=inp.value;saveSoon();}
});

document.addEventListener('click',function(e){
  resumeAudio();
  var tab=e.target.closest('[data-tab]');
  if(tab){state.ui.tab=tab.dataset.tab;state.ui.forcePicker=false;save();render();return;}
  var a=e.target.closest('[data-action]');if(!a)return;
  var act=a.dataset.action;
  if(act==='step'){
    var row=a.closest('.set-row'),card=a.closest('.ex-card'),exId=card.dataset.ex,i=+row.dataset.set,f=a.dataset.field,step=+a.dataset.step;
    var inp=row.querySelector('.val[data-field="'+f+'"]');var v=num(inp.value)+step;if(v<0)v=0;if(f!=='w')v=Math.round(v);v=+v.toFixed(2);
    inp.value=(v===0&&f==='w')?'':String(v);
    if(state.activeWorkout&&state.activeWorkout.logs[exId])state.activeWorkout.logs[exId][i][f]=inp.value;saveSoon();return;
  }
  if(act==='toggle-set'){
    var row2=a.closest('.set-row'),card2=a.closest('.ex-card'),exId2=card2.dataset.ex,i2=+row2.dataset.set;
    var s=state.activeWorkout.logs[exId2][i2];
    ['w','r','rir'].forEach(function(f){var el=row2.querySelector('.val[data-field="'+f+'"]');if(el)s[f]=el.value;});
    s.done=!s.done;save();
    if(s.done){var ex=EXMAP[exId2];startTimer(ex.rest,ex.name);}
    render();return;
  }
  if(act==='add-set'){var exId3=a.closest('.ex-card').dataset.ex,arr=state.activeWorkout.logs[exId3];var last=arr[arr.length-1]||{w:'',r:''};arr.push({w:last.w||'',r:'',rir:'',done:false});save();render();return;}
  if(act==='start-session'){startWorkout(a.dataset.session);return;}
  if(act==='resume'){state.ui.forcePicker=false;save();render();return;}
  if(act==='show-picker'){state.ui.forcePicker=true;render();return;}
  if(act==='finish'){finishWorkout();return;}
  if(act==='toggle-prog'){var id='p_'+a.dataset.ex;state.ui.openEx=(state.ui.openEx===id)?null:id;render();return;}
  if(act==='t-minus'){bumpTimer(-15);return;}
  if(act==='t-plus'){bumpTimer(15);return;}
  if(act==='t-toggle'){toggleTimer();return;}
  if(act==='t-skip'){hideTimer();return;}
  if(act==='set-week'){return;}
  if(act==='toggle-setting'){var k=a.dataset.key;state.settings[k]=!state.settings[k];save();if(k==='keepAwake'){state.settings[k]&&state.activeWorkout?requestWake():releaseWake();}render();return;}
  if(a.dataset.week){state.settings.week=+a.dataset.week;if(state.activeWorkout)state.activeWorkout.week=+a.dataset.week;save();render();return;}
  if(act==='export'){doExport();return;}
  if(act==='import'){$('#importFile').click();return;}
  if(act==='reset-block'){confirmModal('Recommencer le bloc : repasse en Semaine 1 (l’historique est conservé).','do-reset-block');return;}
  if(act==='do-reset-block'){state.settings.week=1;state.settings.startDate=todayISO();save();closeModal();render();return;}
  if(act==='clear-history'){confirmModal('Effacer TOUT l’historique de tes séances ? Irréversible.','do-clear-history');return;}
  if(act==='do-clear-history'){state.history=[];save();closeModal();render();return;}
  if(act==='reset-app'){confirmModal('Tout réinitialiser (historique + réglages + séance en cours) ?','do-reset-app');return;}
  if(act==='do-reset-app'){state=defState();save();closeModal();render();return;}
  if(act==='go-progress'){closeModal();state.ui.tab='progress';save();render();return;}
  if(act==='close-modal'){closeModal();return;}
});
$('#modal-root').addEventListener('click',function(e){if(e.target.id==='modal-root')closeModal();});

$('#importFile').addEventListener('change',function(e){
  var f=e.target.files[0];if(!f)return;var rd=new FileReader();
  rd.onload=function(){try{var d=JSON.parse(rd.result);if(d&&d.history&&d.settings){state=Object.assign(defState(),d);state.ui={tab:'progress',forcePicker:false,openEx:null};save();render();modal('<h3>Importé ✅</h3><p class="muted">'+state.history.length+' séances restaurées.</p><button class="btn btn-primary btn-block" data-action="close-modal">OK</button>');}else throw 0;}catch(err){alert('Fichier invalide.');}};
  rd.readAsText(f);e.target.value='';
});
function doExport(){
  var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='muscu-sauvegarde-'+todayISO()+'.json';document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(url);a.remove();},100);
}

/* live duration ticker */
setInterval(function(){if(state.activeWorkout&&state.ui.tab==='workout'&&!state.ui.forcePicker){var el=$('#liveDur');if(el)el.textContent=fmtTime((Date.now()-state.activeWorkout.startedAt)/1000);}},1000);

/* ============ INIT ============ */
load();
if(state.activeWorkout&&state.activeWorkout.dateISO!==todayISO()){/* garde la séance entamée même un autre jour */}
render();
if(state.activeWorkout)requestWake();
})();
</script>
</body>
