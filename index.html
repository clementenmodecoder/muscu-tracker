<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Tracker de séance de musculation — 100% hors-ligne, données locales.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%234f46e5'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle'%3E%F0%9F%8F%8B%EF%B8%8F%3C/text%3E%3C/svg%3E">
<title>Tracker Muscu</title>
<style>
  :root{
    /* --- Design tokens · thème clair --- */
    --bg:#f4f5f9; --card:#ffffff; --card2:#f7f8fc; --field:#f2f3f8;
    --line:#e9ebf2; --line2:#dfe2ec;
    --text:#161b2c; --text2:#5b6374; --muted:#9299ab;
    --accent:#4f46e5; --accent-d:#4038c7; --accent-soft:#eef0fe; --accent-soft2:#e2e5fd;
    --grad:linear-gradient(135deg,#5a51ef 0%,#7c3aed 100%);
    --green:#16a34a; --green-d:#137a3a; --green-soft:#e7f6ec;
    --amber:#c97b00; --amber-soft:#fdf3e0;
    --red:#dc3d4d; --red-soft:#fdecee;
    --chart-de:#c6cafa; --grid:#eceef4; --baseline:#d9dce6;
    /* muscles — palette catégorielle validée (CVD-safe, ≥3:1 sur blanc) */
    --m-chest:#d64545; --m-back:#2a78d6; --m-delts:#c97b00; --m-rear:#d0549b;
    --m-arms-tri:#7a4fd6; --m-arms-bi:#0f9f8f; --m-legs:#4a9d23; --m-core:#96801f; --m-cuff:#0e9bc0;
    --nav-h:64px; --radius:20px;
    --sh-sm:0 1px 2px rgba(22,27,44,.05);
    --sh:0 1px 2px rgba(22,27,44,.04),0 8px 24px -8px rgba(22,27,44,.10);
    --sh-lg:0 8px 24px -6px rgba(79,70,229,.38);
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px; line-height:1.45;
    padding-bottom:calc(var(--nav-h) + var(--safe-b) + 110px);
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:contain;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 16px;}
  svg.i{display:inline-block;vertical-align:-3px;flex:none;}

  /* ================= HEADER ================= */
  #hdr{position:sticky;top:0;z-index:40;background:rgba(244,245,249,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);}
  .hdr-in{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;max-width:560px;margin:0 auto;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{width:34px;height:34px;border-radius:11px;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:var(--sh-lg);}
  .brand-name{font-size:17px;font-weight:800;letter-spacing:-.02em;}
  .brand-name span{color:var(--muted);font-weight:600;}
  .week-pill{background:var(--card);border:1px solid var(--line2);border-radius:999px;box-shadow:var(--sh-sm);
    padding:8px 14px;font-size:13px;font-weight:700;color:var(--text2);cursor:pointer;white-space:nowrap;font-family:inherit;}
  .week-pill b{color:var(--accent);}
  #hdrProg{height:3px;background:transparent;position:relative;}
  #hdrProg .fill{position:absolute;left:0;top:0;bottom:0;background:var(--grad);border-radius:0 3px 3px 0;transition:width .3s ease;}

  /* ================= GENERIC ================= */
  h2{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:26px 2px 10px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--sh);}
  .btn{appearance:none;border:none;border-radius:14px;font-weight:700;font-size:15px;cursor:pointer;
    padding:14px 18px;color:var(--text);background:var(--card2);transition:transform .08s,filter .15s;font-family:inherit;
    display:inline-flex;align-items:center;justify-content:center;gap:8px;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--grad);color:#fff;box-shadow:var(--sh-lg);}
  .btn-block{display:flex;width:100%;}
  .btn-ghost{background:var(--card);color:var(--text);border:1px solid var(--line2);box-shadow:var(--sh-sm);}
  .btn-danger{background:transparent;color:var(--red);border:1px solid #f3c2c8;}
  .muted{color:var(--text2);} .small{font-size:13px;} .center{text-align:center;}
  .hidden{display:none!important;}
  a{color:var(--accent);}
  .enter{animation:viewIn .3s cubic-bezier(.22,.9,.36,1) both;}
  @keyframes viewIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

  /* ================= HERO (accueil) ================= */
  .hero{position:relative;overflow:hidden;background:var(--grad);border-radius:24px;padding:20px;margin-top:14px;
    color:#fff;box-shadow:0 16px 40px -12px rgba(79,70,229,.45);}
  .hero::before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.10);top:-110px;right:-60px;}
  .hero::after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.07);bottom:-80px;left:-40px;}
  .hero-top{position:relative;display:flex;align-items:center;justify-content:space-between;gap:14px;}
  .hero-date{font-size:12.5px;font-weight:600;color:rgba(255,255,255,.75);text-transform:capitalize;}
  .hero-title{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:2px 0 4px;}
  .hero-msg{font-size:13.5px;color:rgba(255,255,255,.9);max-width:230px;}
  .ring{flex:none;}
  .ring-track{fill:none;stroke:rgba(255,255,255,.25);}
  .ring-fg{fill:none;stroke:#fff;stroke-linecap:round;stroke-dasharray:var(--c);stroke-dashoffset:var(--o);
    animation:ringIn .9s cubic-bezier(.22,.9,.36,1) both;}
  @keyframes ringIn{from{stroke-dashoffset:var(--c);}}
  .ring text{fill:#fff;font-weight:800;}
  .hero-days{position:relative;display:flex;justify-content:space-between;gap:6px;margin-top:16px;}
  .day{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10.5px;font-weight:700;color:rgba(255,255,255,.65);}
  .day .dot{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;
    font-size:12.5px;font-weight:800;color:rgba(255,255,255,.85);border:2px solid transparent;}
  .day.done .dot{background:#fff;color:var(--accent);}
  .day.today .dot{border-color:#fff;}
  .hero-chips{position:relative;display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
  .hero-chip{background:rgba(255,255,255,.16);backdrop-filter:blur(4px);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700;}

  /* ================= SESSION CARDS ================= */
  .reco{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--sh);
    padding:18px;margin-bottom:12px;overflow:hidden;}
  .reco-bar{position:absolute;left:0;top:0;bottom:0;width:5px;border-radius:0 4px 4px 0;}
  .reco-tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
    color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:4px 10px;margin-bottom:8px;}
  .reco-name{font-size:19px;font-weight:800;letter-spacing:-.02em;}
  .reco-sub{font-size:13px;color:var(--text2);margin:3px 0 14px;}
  .reco-meta{display:flex;gap:14px;font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:14px;}
  .reco-meta span{display:flex;align-items:center;gap:5px;}

  .pick-grid{display:grid;gap:10px;}
  .pick{display:flex;align-items:center;gap:13px;text-align:left;padding:14px 15px;border-radius:18px;
    background:var(--card);border:1px solid var(--line);box-shadow:var(--sh-sm);cursor:pointer;width:100%;color:var(--text);font-family:inherit;transition:transform .08s;}
  .pick:active{transform:scale(.985);}
  .pick-dot{width:12px;height:44px;border-radius:6px;flex:none;}
  .pick-main{flex:1;min-width:0;}
  .pick-name{display:block;font-weight:800;font-size:15.5px;letter-spacing:-.01em;}
  .pick-sub{display:block;font-size:12.5px;color:var(--text2);margin-top:2px;}
  .pick-meta{display:block;font-size:11.5px;color:var(--muted);margin-top:3px;font-weight:600;}
  .pick-done{display:inline-flex;align-items:center;gap:4px;color:var(--green);font-size:11.5px;font-weight:800;}
  .pick-arrow{color:var(--muted);flex:none;}

  .resume-card{background:var(--accent-soft);border:1px solid var(--accent-soft2);border-radius:var(--radius);padding:16px;margin-top:14px;margin-bottom:2px;}
  .resume-card .t{font-weight:800;font-size:15px;color:var(--accent-d);display:flex;align-items:center;gap:8px;}
  .resume-card .s{font-size:13px;color:var(--text2);margin:4px 0 12px;}

  /* ================= WORKOUT ================= */
  .sess-head{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--sh);padding:16px;margin-top:14px;margin-bottom:12px;}
  .sess-head-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .sess-name{font-size:19px;font-weight:800;letter-spacing:-.02em;}
  .sess-focus{font-size:12.5px;color:var(--text2);margin-top:2px;}
  .sess-timechip{display:flex;align-items:center;gap:6px;background:var(--field);border-radius:10px;padding:6px 10px;
    font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--text2);flex:none;}
  .sess-week{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text2);margin-top:10px;flex-wrap:wrap;}
  .rir-chip{background:var(--amber-soft);color:var(--amber);border-radius:8px;padding:2px 9px;font-weight:800;font-size:12px;}
  .sess-note{font-size:12.5px;color:var(--muted);margin-top:6px;}
  .sess-prog{margin-top:13px;}
  .sess-prog .lbl{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--text2);margin-bottom:6px;}
  .sess-prog .lbl b{font-variant-numeric:tabular-nums;color:var(--text);}
  .ptrack{height:8px;background:var(--field);border-radius:99px;overflow:hidden;}
  .ptrack .fill{height:100%;background:var(--grad);border-radius:99px;transition:width .3s ease;}
  .ptrack.mini{height:6px;}
  .ptrack .fill.green{background:var(--green);}

  .banner{display:flex;gap:10px;background:var(--amber-soft);border:1px solid #f3e3c2;border-radius:16px;
    padding:12px 14px;margin-bottom:12px;font-size:13px;color:#7a5200;}
  .banner b{color:#5f4000;}
  .banner .ic{flex:none;font-size:16px;line-height:1.3;}
  .banner.info{background:var(--accent-soft);border-color:var(--accent-soft2);color:var(--accent-d);}
  .banner.info b{color:var(--accent-d);}

  /* EXERCISE CARD */
  .ex-card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    margin-bottom:12px;overflow:hidden;box-shadow:var(--sh);transition:opacity .25s;}
  .ex-card.card-done{opacity:.62;}
  .ex-bar{position:absolute;left:0;top:0;bottom:0;width:5px;}
  .ex-card.card-done .ex-bar{background:var(--green)!important;}
  .ex-body{padding:14px 15px 14px 18px;}
  .ex-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
  .ex-muscle{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;margin-bottom:3px;display:flex;align-items:center;gap:5px;}
  .ex-title{font-weight:800;font-size:16px;letter-spacing:-.01em;line-height:1.25;}
  .ex-title .opt{font-size:10px;font-weight:800;color:var(--muted);background:var(--field);padding:2px 7px;border-radius:6px;margin-left:6px;vertical-align:middle;text-transform:uppercase;}
  .warn-badge{color:var(--amber);font-size:14px;}
  .ex-prog{font-variant-numeric:tabular-nums;font-weight:800;font-size:13px;color:var(--text2);background:var(--field);
    border-radius:99px;padding:5px 11px;white-space:nowrap;flex:none;}
  .ex-prog.full{color:#fff;background:var(--green);}
  .ex-meta{font-size:12.5px;color:var(--text2);margin:6px 0 2px;font-weight:600;}
  .ex-prev{font-size:12px;color:var(--muted);margin:7px 0 4px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .progress-badge{background:var(--green-soft);color:var(--green-d);font-weight:800;font-size:11px;padding:3px 9px;border-radius:99px;}

  /* SET ROWS */
  .sets{margin-top:11px;display:flex;flex-direction:column;gap:8px;}
  .set-labels{display:grid;grid-template-columns:28px 1fr 1fr 46px 44px;gap:6px;font-size:10px;color:var(--muted);
    text-transform:uppercase;letter-spacing:.05em;font-weight:800;padding:0 7px;margin-bottom:-2px;}
  .set-labels span{text-align:center;}
  .set-row{display:grid;grid-template-columns:28px 1fr 1fr 46px 44px;gap:6px;align-items:center;
    background:var(--card2);border-radius:14px;padding:7px;border:1px solid var(--line);transition:background .2s,border-color .2s;}
  .set-row.done{background:var(--green-soft);border-color:#c4e8d0;}
  .set-num{width:28px;height:28px;border-radius:9px;background:var(--field);display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:13px;color:var(--text2);}
  .set-row.done .set-num{background:var(--green);color:#fff;}
  .field{display:flex;align-items:center;background:var(--card);border-radius:11px;overflow:hidden;border:1px solid var(--line2);}
  .field .step{width:26px;height:40px;border:none;background:transparent;color:var(--muted);font-size:19px;font-weight:700;cursor:pointer;flex:none;font-family:inherit;}
  .field .step:active{background:var(--field);color:var(--accent);}
  .field .val{width:100%;min-width:0;border:none;background:transparent;color:var(--text);text-align:center;
    font-size:15px;font-weight:800;padding:10px 0;font-family:inherit;font-variant-numeric:tabular-nums;}
  .field .val:focus{outline:none;}
  .field.rir{justify-content:center;}
  .field.rir .val{padding:9px 4px;}
  .done-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line2);background:var(--card);color:var(--muted);
    cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center;transition:background .15s;}
  .set-row.done .done-btn{background:var(--green);border-color:var(--green);color:#fff;}
  .add-set{margin-top:9px;width:100%;background:transparent;border:1.5px dashed var(--line2);color:var(--text2);
    border-radius:12px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}

  /* NOTES */
  details.ex-notes{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;}
  details.ex-notes summary{font-size:12.5px;color:var(--text2);font-weight:700;cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px;}
  details.ex-notes summary::-webkit-details-marker{display:none;}
  details.ex-notes summary::after{content:"▾";margin-left:auto;color:var(--muted);}
  details.ex-notes[open] summary::after{content:"▴";}
  .ex-notes p{font-size:13px;margin:9px 0 0;color:var(--text2);}
  .ex-notes .amp{color:#1d4f8f;background:#ebf2fd;border-radius:10px;padding:9px 11px;}
  .ex-notes .warn{color:#8a5800;background:var(--amber-soft);border-radius:10px;padding:9px 11px;}

  /* FINISH */
  .finish-zone{margin:20px 0 8px;}
  .summary-line{display:flex;justify-content:space-between;font-size:13.5px;padding:8px 2px;border-bottom:1px solid var(--line);}
  .summary-line b{font-variant-numeric:tabular-nums;}

  /* ================= TIMER BAR ================= */
  .timerbar{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + var(--safe-b) + 10px);z-index:60;padding:0 12px;pointer-events:none;}
  .tb-in{max-width:536px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:20px;
    box-shadow:0 12px 36px -6px rgba(22,27,44,.25);padding:12px 14px;pointer-events:auto;}
  .timerbar.done .tb-in{background:var(--green-soft);border-color:#c4e8d0;}
  .tb-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .tb-ex{font-size:12.5px;color:var(--text2);font-weight:700;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tb-time{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
  .timerbar.done .tb-time{color:var(--green);}
  .tb-track{height:6px;background:var(--field);border-radius:3px;overflow:hidden;margin-bottom:10px;}
  .tb-fill{height:100%;background:var(--grad);width:100%;transition:width .25s linear;border-radius:3px;}
  .timerbar.done .tb-fill{background:var(--green);}
  .tb-btns{display:flex;gap:7px;}
  .tb-btns button{flex:1;background:var(--card2);border:1px solid var(--line2);color:var(--text);
    border-radius:12px;padding:10px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;
    display:flex;align-items:center;justify-content:center;gap:5px;}
  .tb-btns .tb-skip{flex:1.2;color:var(--text2);}
  .tb-btns .tb-toggle{background:var(--accent);color:#fff;border-color:var(--accent);}

  /* ================= NAV ================= */
  #nav{position:fixed;left:0;right:0;bottom:0;z-index:70;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border-top:1px solid var(--line);display:flex;height:var(--nav-h);padding-bottom:var(--safe-b);}
  .nav-btn{flex:1;background:none;border:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:3px;font-size:10.5px;font-weight:700;cursor:pointer;font-family:inherit;padding-top:5px;}
  .nav-btn .ic-wrap{width:44px;height:26px;border-radius:99px;display:flex;align-items:center;justify-content:center;transition:background .2s;}
  .nav-btn.active{color:var(--accent);}
  .nav-btn.active .ic-wrap{background:var(--accent-soft);}

  /* ================= PROGRESS ================= */
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;margin-bottom:6px;}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--sh-sm);}
  .stat .l{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
  .stat .v{font-size:24px;font-weight:800;line-height:1.15;margin-top:4px;letter-spacing:-.02em;}
  .stat .v small{font-size:14px;color:var(--muted);font-weight:700;}
  .stat .s{font-size:11.5px;color:var(--text2);margin-top:2px;font-weight:600;}
  .chart-card{padding:16px 12px 10px;}
  .chart-card .ct{font-size:13.5px;font-weight:800;margin:0 4px 2px;letter-spacing:-.01em;}
  .chart-card .cs{font-size:11.5px;color:var(--muted);margin:0 4px 8px;font-weight:600;}
  .chart-svg{display:block;width:100%;height:auto;}
  .msplit{display:flex;flex-direction:column;gap:9px;margin-top:4px;}
  .msplit-row{display:flex;align-items:center;gap:9px;font-size:12.5px;}
  .msplit-row .nm{width:104px;flex:none;font-weight:700;color:var(--text2);display:flex;align-items:center;gap:6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
  .msplit-row .nm i{width:8px;height:8px;border-radius:3px;flex:none;}
  .msplit-row .track{flex:1;height:12px;background:var(--field);border-radius:99px;overflow:hidden;}
  .msplit-row .track b{display:block;height:100%;border-radius:99px;}
  .msplit-row .ct2{width:26px;text-align:right;font-weight:800;font-variant-numeric:tabular-nums;color:var(--text);flex:none;}

  .pcard{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:10px;overflow:hidden;box-shadow:var(--sh-sm);}
  .pcard-head{display:flex;align-items:center;gap:11px;padding:13px 14px;cursor:pointer;}
  .pcard-info{flex:1;min-width:0;}
  .pcard-name{font-weight:800;font-size:14.5px;letter-spacing:-.01em;}
  .pcard-sub{font-size:11.5px;color:var(--muted);margin-top:2px;font-weight:600;}
  .spark{flex:none;}
  .pcard-best{text-align:right;flex:none;}
  .pcard-best .v{font-weight:800;font-size:15px;}
  .pcard-best .l{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
  .pcard-detail{border-top:1px solid var(--line);padding:12px 12px 8px;font-size:13px;background:var(--card2);}
  .htable{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px;}
  .htable td{padding:7px 4px;border-bottom:1px solid var(--line);}
  .htable tr:last-child td{border-bottom:none;}
  .htable td:first-child{color:var(--muted);white-space:nowrap;font-weight:600;}
  .htable td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;}
  .pr-tag{color:var(--amber);font-weight:800;}

  /* ================= PROGRAM ================= */
  .prog-sess{margin-bottom:8px;}
  .ex-line{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
  .ex-line:last-child{border-bottom:none;}
  .ex-line .n{font-weight:700;}
  .ex-line .d{color:var(--muted);font-size:12px;text-align:right;white-space:nowrap;flex:none;font-weight:600;}
  .info-block{font-size:13.5px;}
  .info-block p{margin:8px 0;color:var(--text2);}
  .info-block b{color:var(--text);}
  .info-block ul{margin:8px 0;padding-left:18px;color:var(--text2);}
  .info-block li{margin:6px 0;}
  .ptable{width:100%;border-collapse:collapse;font-size:12.5px;margin:8px 0;}
  .ptable th,.ptable td{border:1px solid var(--line2);padding:8px 9px;text-align:left;vertical-align:top;}
  .ptable th{background:var(--card2);font-size:10.5px;text-transform:uppercase;color:var(--muted);letter-spacing:.04em;}
  .ptable td{color:var(--text2);} .ptable td b{color:var(--text);}

  /* ================= SETTINGS ================= */
  .seg{display:flex;gap:7px;}
  .seg button{flex:1;background:var(--card2);border:1px solid var(--line2);color:var(--text2);border-radius:12px;
    padding:12px 4px;font-weight:800;cursor:pointer;font-family:inherit;font-size:14px;transition:.15s;}
  .seg button.on{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:var(--sh-lg);}
  .set-toggle{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line);font-weight:600;font-size:14.5px;}
  .set-toggle:last-child{border-bottom:none;}
  .switch{width:50px;height:30px;border-radius:999px;background:var(--line2);position:relative;cursor:pointer;flex:none;transition:.2s;border:none;}
  .switch.on{background:var(--green);}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25);}
  .switch.on::after{left:23px;}

  /* ================= MODAL ================= */
  #modal-root{position:fixed;inset:0;z-index:200;display:none;align-items:flex-end;justify-content:center;
    background:rgba(22,27,44,.45);backdrop-filter:blur(4px);}
  #modal-root.show{display:flex;}
  .modal{background:var(--card);border-radius:26px 26px 0 0;width:100%;max-width:560px;
    padding:12px 20px calc(26px + var(--safe-b));animation:up .3s cubic-bezier(.22,.9,.36,1);}
  .modal-handle{width:40px;height:5px;border-radius:99px;background:var(--line2);margin:0 auto 16px;}
  @keyframes up{from{transform:translateY(60px);opacity:.5;}to{transform:translateY(0);opacity:1;}}
  .modal h3{margin:0 0 4px;font-size:21px;letter-spacing:-.02em;}
  .modal-emoji{font-size:40px;text-align:center;margin:4px 0 10px;animation:pop .5s cubic-bezier(.22,1.4,.36,1);}
  @keyframes pop{from{transform:scale(.3);opacity:0;}to{transform:scale(1);opacity:1;}}
  .sum-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0;}
  .sum-cell{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:11px 6px;text-align:center;}
  .sum-cell .v{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;}
  .sum-cell .l{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin-top:2px;}
  .pr-list{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0;}
  .pr-chip{background:var(--amber-soft);color:#8a5800;border-radius:10px;padding:7px 11px;font-size:12.5px;font-weight:700;}
  .modal-week{background:var(--accent-soft);border-radius:14px;padding:12px 14px;margin:12px 0;}
  .modal-week .t{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;color:var(--accent-d);margin-bottom:7px;}

  /* TOOLTIP */
  #tip{position:absolute;z-index:300;background:#232a40;color:#fff;font-size:12px;font-weight:600;border-radius:9px;
    padding:6px 10px;pointer-events:none;opacity:0;transition:opacity .12s;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.25);}
  #tip.show{opacity:1;}

  #errbar{position:fixed;top:0;left:0;right:0;background:var(--red);color:#fff;padding:8px;font-size:12px;z-index:999;text-align:center;}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>

var MAIN_SESSIONS=['hautA','pull','hautB'];

/* ============ STATE ============ */
var KEY='muscu_tracker_v1', state;
function defState(){return {settings:{week:1,goal:3,sound:true,vibrate:true,keepAwake:true,startDate:todayISO()},activeWorkout:null,history:[],ui:{tab:'workout',forcePicker:false,openEx:null,notes:{}}};}
function load(){try{var r=localStorage.getItem(KEY);state=r?JSON.parse(r):defState();}catch(e){state=defState();}
  if(!state.settings)state.settings=defState().settings;
  if(!state.settings.goal)state.settings.goal=3;
  if(!state.ui)state.ui={tab:'workout',forcePicker:false,openEx:null,notes:{}};
  if(!state.ui.notes)state.ui.notes={};
  if(!state.history)state.history=[];}
var saveT;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function saveSoon(){clearTimeout(saveT);saveT=setTimeout(save,400);}

/* ============ HELPERS ============ */
function $(s,r){return (r||document).querySelector(s);}
function todayISO(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function pad(n){return n<10?'0'+n:''+n;}
function num(v){if(v==null)return 0;var n=parseFloat(String(v).replace(',','.'));return isNaN(n)?0:n;}
function fmtTime(s){s=Math.max(0,Math.round(s));return pad(Math.floor(s/60))+':'+pad(s%60);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function extractNum(load){if(!load)return '';if(/rir|pdc|léger|leger|modéré|modere/i.test(load))return '';var m=load.match(/\d+([.,]\d+)?/);return m?String(num(m[0])):'';}
function dateLabel(iso){var d=new Date(iso+'T12:00');return d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});}
function shortDate(iso){return new Date(iso+'T12:00').toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'});}
function daysAgo(iso){var d=daysAgoNum(iso);return d<=0?'aujourd’hui':d===1?'hier':'il y a '+d+'j';}
function daysAgoNum(iso){return Math.round((new Date(todayISO()+'T12:00')-new Date(iso+'T12:00'))/86400000);}
function recoSessionId(){var m={1:'hautA',3:'pull',5:'hautB'};return m[new Date().getDay()]||null;}
function frNum(n,dec){return n.toLocaleString('fr-FR',{maximumFractionDigits:dec==null?0:dec});}
function fmtK(n){n=Math.round(n);if(n>=100000)return frNum(n/1000,0)+' k';if(n>=1000)return frNum(n/1000,1)+' k';return frNum(n);}

function addDaysISO(iso,n){var d=new Date(iso+'T12:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function weekStartISO(iso){var d=new Date(iso+'T12:00');var off=(d.getDay()+6)%7;d.setDate(d.getDate()-off);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function sessionsInWeek(ws){return state.history.filter(function(h){return weekStartISO(h.dateISO)===ws;});}
function histVol(h){var v=0;Object.keys(h.logs).forEach(function(k){h.logs[k].forEach(function(s){if(s.done)v+=num(s.w)*num(s.r);});});return v;}
function weeklyStats(){
  var ws=weekStartISO(todayISO()),list=sessionsInWeek(ws),goal=state.settings.goal||3;
  var mains=MAIN_SESSIONS.map(function(id){return {id:id,done:list.some(function(h){return h.sessionId===id;})};});
  var bonus=list.filter(function(h){return h.sessionId==='bras';}).length;
  return {ws:ws,count:list.length,goal:goal,pct:Math.min(100,Math.round(list.length/goal*100)),mains:mains,bonus:bonus,doneDays:list.map(function(h){return h.dateISO;})};
}
function weekStreak(){
  var goal=state.settings.goal||3,streak=0,ws=weekStartISO(todayISO());
  if(sessionsInWeek(ws).length>=goal)streak++;
  var prev=addDaysISO(ws,-7);
  while(sessionsInWeek(prev).length>=goal){streak++;prev=addDaysISO(prev,-7);}
  return streak;
}
function estMin(s){var t=0;s.ex.forEach(function(e){if(!e.optional)t+=e.sets*(e.rest+45);});return Math.round(t/60/5)*5;}

function lastPerf(exId){for(var i=state.history.length-1;i>=0;i--){var h=state.history[i],arr=h.logs[exId];if(arr){var done=arr.filter(function(s){return s.done&&String(s.r)!=='';});if(done.length)return {date:h.dateISO,sets:done};}}return null;}
function histFor(exId){var out=[];state.history.forEach(function(h){var arr=h.logs[exId];if(arr){var done=arr.filter(function(s){return s.done&&String(s.r)!=='';});if(done.length)out.push({date:h.dateISO,sets:done});}});return out;}
function bestWeight(exId,before){var m=0;state.history.forEach(function(h){if(before&&h.dateISO>=before)return;(h.logs[exId]||[]).forEach(function(s){if(s.done)m=Math.max(m,num(s.w));});});return m;}
function e1rm(w,r){return w*(1+r/30);}

/* ============ WORKOUT LIFECYCLE ============ */
function startWorkout(sid){
  var s=SESSMAP[sid];if(!s)return;
  var logs={};
  s.ex.forEach(function(e){
    var lp=lastPerf(e.id),arr=[];
    for(var i=0;i<e.sets;i++){
      var w='',r='';
      if(lp){var ls=lp.sets[i]||lp.sets[lp.sets.length-1];if(ls){w=ls.w||'';r=ls.r||'';}}
      if(w===''||w==null)w=extractNum(e.load);
      if(r===''||r==null)r=String(e.repMin);
      arr.push({w:String(w),r:String(r),rir:'',done:false});
    }
    logs[e.id]=arr;
  });
  state.activeWorkout={sessionId:sid,dateISO:todayISO(),week:state.settings.week,startedAt:Date.now(),logs:logs};
  state.ui.forcePicker=false;state.ui.tab='workout';
  save();requestWake();render();window.scrollTo(0,0);
}
function finishWorkout(){
  var w=state.activeWorkout;if(!w)return;
  var sess=SESSMAP[w.sessionId];
  var setsDone=0,vol=0,prs=[];
  sess.ex.forEach(function(e){
    var prev=bestWeight(e.id,w.dateISO),maxW=0;
    (w.logs[e.id]||[]).forEach(function(s){if(s.done){setsDone++;vol+=num(s.w)*num(s.r);maxW=Math.max(maxW,num(s.w));}});
    if(maxW>0&&prev>0&&maxW>prev)prs.push(e.name+' '+maxW+' kg');
  });
  var dur=Math.round((Date.now()-w.startedAt)/1000);
  state.history.push({id:'h'+Date.now(),sessionId:w.sessionId,dateISO:w.dateISO,week:w.week,durationSec:dur,logs:w.logs});
  state.activeWorkout=null;releaseWake();save();
  showSummary({name:sess.name,dur:dur,setsDone:setsDone,vol:Math.round(vol),prs:prs});
}
function cancelWorkout(){state.activeWorkout=null;state.ui.forcePicker=false;releaseWake();save();render();}

/* ============ CHARTS ============ */
function niceMax(v){if(v<=0)return 1;var p=Math.pow(10,Math.floor(Math.log10(v)));var st=[1,1.5,2,2.5,3,4,5,6,8,10];for(var i=0;i<st.length;i++){if(st[i]*p>=v)return st[i]*p;}return 10*p;}
function barTop(x,y,w,h,r){r=Math.min(r,w/2,h);var x2=x+w;
  return 'M'+x.toFixed(1)+','+(y+h).toFixed(1)+' L'+x.toFixed(1)+','+(y+r).toFixed(1)+' Q'+x.toFixed(1)+','+y.toFixed(1)+' '+(x+r).toFixed(1)+','+y.toFixed(1)+
  ' L'+(x2-r).toFixed(1)+','+y.toFixed(1)+' Q'+x2.toFixed(1)+','+y.toFixed(1)+' '+x2.toFixed(1)+','+(y+r).toFixed(1)+' L'+x2.toFixed(1)+','+(y+h).toFixed(1)+' Z';}
/* items: [{label, v, tip}] — dernier = période courante (accent), autres en teinte douce */
function barChart(items,opts){
  opts=opts||{};
  var W=340,H=156,px=8,pt=22,pb=20,plotW=W-2*px,plotH=H-pt-pb,base=H-pb,n=items.length;
  var max=0;items.forEach(function(it){if(it.v>max)max=it.v;});
  if(opts.goal&&opts.goal>max)max=opts.goal;
  max=opts.intScale?Math.max(Math.ceil(max),2):niceMax(max);
  var slot=plotW/n,barW=Math.min(24,slot*0.6);
  var s='<svg class="chart-svg" viewBox="0 0 '+W+' '+H+'">';
  [0.5,1].forEach(function(f){var y=base-f*plotH;
    s+='<line x1="'+px+'" y1="'+y.toFixed(1)+'" x2="'+(W-px)+'" y2="'+y.toFixed(1)+'" stroke="var(--grid)" stroke-width="1"/>';
    s+='<text x="'+(px+1)+'" y="'+(y-4).toFixed(1)+'" font-size="9" fill="var(--muted)">'+(opts.fmt||fmtK)(max*f)+'</text>';});
  s+='<line x1="'+px+'" y1="'+base+'" x2="'+(W-px)+'" y2="'+base+'" stroke="var(--baseline)" stroke-width="1"/>';
  if(opts.goal){var gy=base-(opts.goal/max)*plotH;
    s+='<line x1="'+px+'" y1="'+gy.toFixed(1)+'" x2="'+(W-px)+'" y2="'+gy.toFixed(1)+'" stroke="var(--amber)" stroke-width="1"/>';
    s+='<text x="'+(W-px-1)+'" y="'+(gy-4).toFixed(1)+'" font-size="9" font-weight="700" fill="var(--amber)" text-anchor="end">objectif '+opts.goal+'</text>';}
  items.forEach(function(it,i){
    var x=px+i*slot+(slot-barW)/2,h=max?(it.v/max)*plotH:0,y=base-h;
    if(it.v>0)s+='<path d="'+barTop(x,y,barW,h,4)+'" fill="'+(i===n-1?'var(--accent)':'var(--chart-de)')+'"/>';
    else s+='<rect x="'+x.toFixed(1)+'" y="'+(base-2)+'" width="'+barW.toFixed(1)+'" height="2" rx="1" fill="var(--line2)"/>';
    if(i===n-1&&it.v>0)s+='<text x="'+(x+barW/2).toFixed(1)+'" y="'+(y-6).toFixed(1)+'" font-size="10" font-weight="700" fill="var(--text2)" text-anchor="middle">'+(opts.fmt||fmtK)(it.v)+'</text>';
    s+='<rect x="'+(px+i*slot).toFixed(1)+'" y="'+pt+'" width="'+slot.toFixed(1)+'" height="'+(plotH+pb).toFixed(1)+'" fill="transparent" data-tip="'+esc(it.tip)+'"/>';
    s+='<text x="'+(x+barW/2).toFixed(1)+'" y="'+(base+14)+'" font-size="9" fill="var(--muted)" text-anchor="middle">'+esc(it.label)+'</text>';
  });
  return s+'</svg>';
}
/* pts: [{d:dateISO, v}] */
function lineChart(pts,opts){
  opts=opts||{};
  var W=340,H=176,pl=38,pr=16,pt=20,pb=24,n=pts.length;
  var plotW=W-pl-pr,plotH=H-pt-pb,base=H-pb;
  var vmin=Infinity,vmax=-Infinity;pts.forEach(function(p){if(p.v<vmin)vmin=p.v;if(p.v>vmax)vmax=p.v;});
  var rng=(vmax-vmin)||Math.max(vmax*0.2,1);
  var dmin=vmin-rng*0.15,dmax=vmax+rng*0.18;
  function X(i){return pl+(n>1?i*plotW/(n-1):plotW/2);}
  function Y(v){return pt+(1-(v-dmin)/(dmax-dmin))*plotH;}
  var fmt=opts.fmt||function(v){return frNum(v,1);};
  var s='<svg class="chart-svg" viewBox="0 0 '+W+' '+H+'">';
  [vmin,(vmin+vmax)/2,vmax].forEach(function(gv){var y=Y(gv);
    s+='<line x1="'+pl+'" y1="'+y.toFixed(1)+'" x2="'+(W-pr)+'" y2="'+y.toFixed(1)+'" stroke="var(--grid)" stroke-width="1"/>';
    s+='<text x="'+(pl-6)+'" y="'+(y+3).toFixed(1)+'" font-size="9" fill="var(--muted)" text-anchor="end">'+fmt(gv)+'</text>';});
  var line=pts.map(function(p,i){return X(i).toFixed(1)+','+Y(p.v).toFixed(1);}).join(' ');
  s+='<polygon points="'+X(0).toFixed(1)+','+base+' '+line+' '+X(n-1).toFixed(1)+','+base+'" fill="var(--accent)" opacity="0.08"/>';
  s+='<polyline points="'+line+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  pts.forEach(function(p,i){
    s+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="3.5" fill="var(--accent)" stroke="var(--card)" stroke-width="2"/>';
    s+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="11" fill="transparent" data-tip="'+shortDate(p.d)+' · '+esc(fmt(p.v))+(opts.unit?' '+opts.unit:'')+'"/>';
  });
  var lx=X(n-1),ly=Y(pts[n-1].v)-9;
  s+='<text x="'+Math.min(lx,W-pr).toFixed(1)+'" y="'+ly.toFixed(1)+'" font-size="11" font-weight="800" fill="var(--text)" text-anchor="end">'+fmt(pts[n-1].v)+(opts.unit?' '+opts.unit:'')+'</text>';
  s+='<text x="'+pl+'" y="'+(H-8)+'" font-size="9" fill="var(--muted)">'+shortDate(pts[0].d)+'</text>';
  s+='<text x="'+(W-pr)+'" y="'+(H-8)+'" font-size="9" fill="var(--muted)" text-anchor="end">'+shortDate(pts[n-1].d)+'</text>';
  return s+'</svg>';
}
function spark(vals){
  var w=64,hh=32,p=4;
  if(!vals.length)return '<svg class="spark" width="'+w+'" height="'+hh+'"></svg>';
  if(vals.length===1)return '<svg class="spark" width="'+w+'" height="'+hh+'"><circle cx="'+(w/2)+'" cy="'+(hh/2)+'" r="3.5" fill="var(--accent)" stroke="var(--card)" stroke-width="2"/></svg>';
  var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),rng=(mx-mn)||1;
  var pts=vals.map(function(v,i){var x=p+i*(w-2*p)/(vals.length-1);var y=hh-p-((v-mn)/rng)*(hh-2*p);return [x,y];});
  var line=pts.map(function(pt){return pt[0].toFixed(1)+','+pt[1].toFixed(1);}).join(' ');
  var last=pts[pts.length-1];
  return '<svg class="spark" width="'+w+'" height="'+hh+'"><polyline fill="none" stroke="var(--chart-de)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="'+line+'"/>'+
    '<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="3" fill="var(--accent)" stroke="var(--card)" stroke-width="1.5"/></svg>';
}
function ringSVG(pct,size){
  var s=size||92,sw=9,r=(s-sw)/2,c=2*Math.PI*r,o=c*(1-Math.min(100,pct)/100);
  return '<svg class="ring" width="'+s+'" height="'+s+'" viewBox="0 0 '+s+' '+s+'">'+
    '<circle class="ring-track" cx="'+s/2+'" cy="'+s/2+'" r="'+r+'" stroke-width="'+sw+'"/>'+
    '<circle class="ring-fg" cx="'+s/2+'" cy="'+s/2+'" r="'+r+'" stroke-width="'+sw+'" transform="rotate(-90 '+s/2+' '+s/2+')" style="--c:'+c.toFixed(1)+';--o:'+o.toFixed(1)+'"/>'+
    '<text x="50%" y="50%" dy="7" text-anchor="middle" font-size="'+Math.round(s*0.23)+'">'+Math.round(pct)+'%</text></svg>';
}

/* ============ RENDER ============ */
var lastTab=null;
function render(){
  $('#weekPill').innerHTML='Bloc · <b>S'+state.settings.week+'</b>';
  Array.prototype.forEach.call(document.querySelectorAll('.nav-btn'),function(b){b.classList.toggle('active',b.dataset.tab===state.ui.tab);});
  var v=$('#view');
  if(state.ui.tab==='workout')v.innerHTML=viewWorkout();
  else if(state.ui.tab==='progress')v.innerHTML=viewProgress();
  else if(state.ui.tab==='program')v.innerHTML=viewProgram();
  else v.innerHTML=viewSettings();
  if(lastTab!==state.ui.tab){v.classList.remove('enter');void v.offsetWidth;v.classList.add('enter');lastTab=state.ui.tab;}
  paintHdrProg();
}
function paintHdrProg(){
  var w=state.activeWorkout,el=$('#hdrProg .fill');
  if(w&&state.ui.tab==='workout'&&!state.ui.forcePicker){
    var done=0,total=0;
    SESSMAP[w.sessionId].ex.forEach(function(e){(w.logs[e.id]||[]).forEach(function(s){total++;if(s.done)done++;});});
    el.style.width=(total?Math.round(done/total*100):0)+'%';
  }else el.style.width='0';
}

  var w=state.activeWorkout;

  var done=0,total=0,vol=0;

  var h='';
  h+='<div class="sess-head"><div class="sess-head-top"><div>'+

    '<div class="sess-week"><b>'+esc(wk.label)+'</b><span class="rir-chip">'+esc(wk.rir)+'</span></div>'+
    '<div class="sess-note">'+esc(wk.note)+'</div>'+
    '<div class="sess-prog"><div class="lbl"><span>Séries complétées</span><b>'+done+' / '+total+'</b></div>'+
    '<div class="ptrack"><div class="fill" style="width:'+pct+'%"></div></div></div></div>';
  h+='<div class="banner"><span class="ic">🔥</span><span><b>Échauffement :</b> 5 min cardio + la 1ʳᵉ ligne coiffe + 1-2 séries de montée en charge sur le 1ᵉʳ gros mouvement. Excentrique 2-4s, jamais d’élan.</span></div>';
  sess.ex.forEach(function(e){h+=exCard(e,w.logs[e.id]);});
  h+='<div class="finish-zone">';
  h+='<div class="card"><div class="summary-line"><span class="muted">Séries faites</span><b>'+done+' / '+total+'</b></div>'+
     '<div class="summary-line" style="border:none"><span class="muted">Volume soulevé</span><b>'+frNum(Math.round(vol))+' kg</b></div></div>';
  h+='<button class="btn btn-primary btn-block" data-action="finish">'+icon('check',18,2.5)+'Terminer la séance</button>';
  h+='<button class="btn btn-ghost btn-block" style="margin-top:9px" data-action="show-picker">Changer de séance</button>';
  h+='<button class="btn btn-danger btn-block" style="margin-top:9px" data-action="cancel-workout">Abandonner la séance</button>';
  h+='</div>';
  return h;
}
function exCard(e,logs){
  logs=logs||[];
  var done=logs.filter(function(s){return s.done;}).length,full=done>0&&done>=logs.length;
  var color='var(--m-'+e.muscle+')';
  var unit=e.unit==='s'?'s':'';
  var lp=lastPerf(e.id),prev='',ready=false;
  if(lp){
    var summ=lp.sets.map(function(s){return s.r+unit;}).join(', ');
    var ws=lp.sets[0]?lp.sets[0].w:'';
    prev='Dernière fois ('+daysAgo(lp.date)+') : '+(ws?ws+' kg × ':'')+summ;
    ready=lp.sets.every(function(s){return num(s.r)>=e.repMax;});
  }else prev='Première fois — note tes charges 💪';
  var notesOpen=!!(state.ui.notes&&state.ui.notes[e.id]);
  var h='<div class="ex-card '+(full?'card-done':'')+'" data-ex="'+e.id+'"><div class="ex-bar" style="background:'+color+'"></div><div class="ex-body">';
  h+='<div class="ex-head"><div>'+
     '<div class="ex-muscle" style="color:'+color+'">'+esc(MUSCLES[e.muscle]||e.muscle)+(e.shoulder?' <span class="warn-badge">⚠︎ épaule</span>':'')+'</div>'+
     '<div class="ex-title">'+esc(e.name)+(e.optional?'<span class="opt">option</span>':'')+'</div></div>';
  h+='<div class="ex-prog '+(full?'full':'')+'">'+done+'/'+logs.length+'</div></div>';
  h+='<div class="ex-meta">'+e.sets+' × '+e.repMin+'-'+e.repMax+unit+' · '+esc(e.load)+' · repos '+fmtTime(e.rest)+'</div>';
  h+='<div class="ex-prev">'+esc(prev)+(ready?' <span class="progress-badge">↑ prêt à monter</span>':'')+'</div>';
  h+='<div class="set-labels"><span>#</span><span>'+(e.unit==='s'?'charge':'kg')+'</span><span>'+(e.unit==='s'?'sec':'reps')+'</span><span>RIR</span><span></span></div>';
  h+='<div class="sets">';
  logs.forEach(function(s,i){h+=setRow(e,i,s);});
  h+='</div><button class="add-set" data-action="add-set">+ ajouter une série</button>';
  h+='<details class="ex-notes" data-ex="'+e.id+'"'+(notesOpen?' open':'')+'><summary>Notes & consignes'+(e.shoulder?' · ⚠︎ épaule':'')+'</summary>';
  if(e.cue)h+='<p>'+esc(e.cue)+'</p>';
  if(e.shoulder){if(e.amp)h+='<p class="amp"><b>Amplitude :</b> '+esc(e.amp)+'</p>';if(e.warn)h+='<p class="warn"><b>⚠ Stop si :</b> '+esc(e.warn)+'</p>';}
  h+='</details></div></div>';
  return h;
}
function setRow(e,i,s){
  return '<div class="set-row '+(s.done?'done':'')+'" data-set="'+i+'">'+
    '<div class="set-num">'+(i+1)+'</div>'+
    '<div class="field"><button class="step" data-action="step" data-field="w" data-step="-1">−</button>'+
      '<input class="val" inputmode="decimal" data-field="w" value="'+esc(s.w)+'"><button class="step" data-action="step" data-field="w" data-step="1">+</button></div>'+
    '<div class="field"><button class="step" data-action="step" data-field="r" data-step="-1">−</button>'+
      '<input class="val" inputmode="numeric" data-field="r" value="'+esc(s.r)+'"><button class="step" data-action="step" data-field="r" data-step="1">+</button></div>'+
    '<div class="field rir"><input class="val" inputmode="numeric" data-field="rir" value="'+esc(s.rir)+'" placeholder="–"></div>'+
    '<button class="done-btn" data-action="toggle-set">'+icon('check',20,2.6)+'</button></div>';
}

function heroMsg(stats){
  if(!state.history.length)return 'Lance ta première séance — tout commence aujourd’hui.';

  return 'Plus que '+left+' séance'+(left>1?'s':'')+' pour ton objectif.';

function dayDots(stats){
  var labels=['L','M','M','J','V','S','D'],today=todayISO(),h='';

    '<div class="stat"><div class="l">Cette semaine</div><div class="v">'+stats.count+'<small> / '+stats.goal+'</small></div><div class="s">'+stats.pct+' % de l’objectif</div></div>'+

    '<div class="stat"><div class="l">Volume total</div><div class="v">'+fmtK(totVol)+'</div><div class="s">kg soulevés</div></div></div>';
  if(!hist.length)return h+'<div class="card center muted" style="margin-top:14px">Aucune séance enregistrée.<br>Termine ta 1ʳᵉ séance pour voir ta progression 📈</div>';

  /* 8 dernières semaines */
  var ws=weekStartISO(todayISO()),weeks=[];
  for(var i=7;i>=0;i--)weeks.push(addDaysISO(ws,-7*i));
  var sessItems=weeks.map(function(w){var n=sessionsInWeek(w).length;
    return {label:shortDate(w),v:n,tip:'Sem. du '+shortDate(w)+' · '+n+' séance'+(n>1?'s':'')};});

    return {label:shortDate(w),v:Math.round(v),tip:'Sem. du '+shortDate(w)+' · '+frNum(Math.round(v))+' kg'};});
  h+='<h2>Assiduité</h2><div class="card chart-card"><div class="ct">Séances par semaine</div>'+
    '<div class="cs">8 dernières semaines · semaine en cours en violet</div>'+
    barChart(sessItems,{goal:stats.goal,intScale:true,fmt:function(v){return frNum(v);}})+'</div>';
  h+='<div class="card chart-card"><div class="ct">Volume par semaine</div>'+
    '<div class="cs">kg soulevés (charge × reps, séries validées)</div>'+
    barChart(volItems)+'</div>';

  /* Répartition par muscle — cette semaine */
  var mus={};sessionsInWeek(ws).forEach(function(h2){Object.keys(h2.logs).forEach(function(k){var e=EXMAP[k];if(!e)return;
    h2.logs[k].forEach(function(s){if(s.done)mus[e.muscle]=(mus[e.muscle]||0)+1;});});});
  var mkeys=Object.keys(mus).sort(function(a,b){return mus[b]-mus[a];});
  if(mkeys.length){
    var mmax=mus[mkeys[0]];
    h+='<div class="card chart-card" style="padding:16px"><div class="ct">Séries par muscle</div><div class="cs">cette semaine</div><div class="msplit">';
    mkeys.forEach(function(k){
      h+='<div class="msplit-row"><span class="nm"><i style="background:var(--m-'+k+')"></i>'+esc(MUSCLES[k]||k)+'</span>'+
        '<span class="track"><b style="width:'+Math.round(mus[k]/mmax*100)+'%;background:var(--m-'+k+')"></b></span>'+
        '<span class="ct2">'+mus[k]+'</span></div>';
    });
    h+='</div></div>';
  }

  /* Progression par exercice */
  var ids=[];Object.keys(EXMAP).forEach(function(id){if(histFor(id).length)ids.push(id);});
  ids.sort(function(a,b){return EXMAP[a].muscle.localeCompare(EXMAP[b].muscle);});
  h+='<h2>Progression par exercice</h2>';
  ids.forEach(function(id){h+=progCard(id);});
  return h;
}
function progCard(id){
  var e=EXMAP[id],hs=histFor(id),open=state.ui.openEx==='p_'+id;
  var weighted=hs.some(function(en){return en.sets.some(function(s){return num(s.w)>0;});});
  var vals=hs.map(function(en){var m=0;en.sets.forEach(function(s){var v=weighted?e1rm(num(s.w),num(s.r)):num(s.r);if(v>m)m=v;});return m;});
  var bestRaw=0;hs.forEach(function(en){en.sets.forEach(function(s){var v=weighted?num(s.w):num(s.r);if(v>bestRaw)bestRaw=v;});});
  var unitTxt=weighted?'kg':(e.unit==='s'?'s':'reps');
  var last=hs[hs.length-1];
  /* évolution depuis la 1ère séance */
  var delta='';
  if(vals.length>1&&vals[0]>0){
    var d=Math.round((vals[vals.length-1]-vals[0])/vals[0]*100);
    if(d!==0)delta='<span style="color:'+(d>0?'var(--green-d)':'var(--amber)')+';font-weight:800"> '+(d>0?'+':'')+d+'%</span>';
  }
  var h='<div class="pcard"><div class="pcard-head" data-action="toggle-prog" data-ex="'+id+'">'+
    '<div class="pcard-info"><div class="pcard-name">'+esc(e.name)+'</div>'+
    '<div class="pcard-sub" style="color:var(--m-'+e.muscle+')">'+esc(MUSCLES[e.muscle]||e.muscle)+'</div>'+
    '<div class="pcard-sub">'+hs.length+' séance'+(hs.length>1?'s':'')+' · '+daysAgo(last.date)+delta+'</div></div>'+
    spark(vals)+
    '<div class="pcard-best"><div class="v">'+frNum(bestRaw,1)+' '+unitTxt+'</div><div class="l">record</div></div></div>';
  if(open){
    h+='<div class="pcard-detail">';
    if(hs.length>1){
      var pts=hs.map(function(en,i){return {d:en.date,v:Math.round(vals[i]*10)/10};});
      if(pts.length>12)pts=pts.slice(pts.length-12);
      h+='<div style="font-size:11.5px;color:var(--muted);font-weight:700;margin-bottom:4px">'+(weighted?'1RM estimé (charge × reps)':'Meilleure série')+'</div>';
      h+=lineChart(pts,{unit:weighted?'kg':unitTxt,fmt:function(v){return frNum(v,1);}});
    }
    h+='<table class="htable">';
    for(var i=hs.length-1;i>=0;i--){var en=hs[i];
      var sets=en.sets.map(function(s){return (num(s.w)>0?s.w+'×':'')+s.r+(e.unit==='s'?'s':'');}).join('  ');
      var topw=0;en.sets.forEach(function(s){topw=Math.max(topw,weighted?num(s.w):num(s.r));});
      var pr=topw>=bestRaw&&bestRaw>0;
      h+='<tr><td>'+shortDate(en.date)+'</td><td>'+esc(sets)+(pr?' <span class="pr-tag">★</span>':'')+'</td></tr>';
    }
    h+='</table></div>';
  }
  h+='</div>';return h;
}

/* ============ REST TIMER ============ */
var Timer={total:0,remaining:0,running:false,endAt:0,iv:null,done:false,label:''};
function startTimer(sec,label){
  if(!sec)return;
  Timer.total=sec;Timer.remaining=sec;Timer.endAt=Date.now()+sec*1000;Timer.running=true;Timer.done=false;Timer.label=label||'Repos';
  $('#timerbar').classList.remove('hidden','done');$('#tbToggle').innerHTML=icon('pause',16,2.4);
  paintTimer();clearInterval(Timer.iv);Timer.iv=setInterval(tickTimer,200);
}
function tickTimer(){
  if(!Timer.running)return;
  var rem=Math.round((Timer.endAt-Date.now())/1000);Timer.remaining=Math.max(0,rem);paintTimer();
  if(rem<=0){Timer.running=false;Timer.done=true;clearInterval(Timer.iv);$('#timerbar').classList.add('done');$('#tbEx').textContent='Repos terminé — c’est reparti !';beepEnd();doVibrate([300,120,300,120,300]);setTimeout(function(){if(Timer.done)hideTimer();},5000);}
}
function paintTimer(){
  $('#tbTime').textContent=fmtTime(Timer.remaining);
  if(!Timer.done)$('#tbEx').textContent='Repos · '+Timer.label;
  var pct=Timer.total?Math.max(0,Math.min(100,(Timer.remaining/Timer.total)*100)):0;$('#tbFill').style.width=pct+'%';
}
function hideTimer(){Timer.running=false;clearInterval(Timer.iv);$('#timerbar').classList.add('hidden');Timer.done=false;}
function toggleTimer(){if(Timer.done)return;if(Timer.running){Timer.running=false;$('#tbToggle').innerHTML=icon('play',16,2.4);}else{Timer.running=true;Timer.endAt=Date.now()+Timer.remaining*1000;$('#tbToggle').innerHTML=icon('pause',16,2.4);}}
function bumpTimer(d){Timer.remaining=Math.max(0,Timer.remaining+d);if(Timer.remaining>Timer.total)Timer.total=Timer.remaining;Timer.endAt=Date.now()+Timer.remaining*1000;if(Timer.done&&Timer.remaining>0){Timer.done=false;Timer.running=true;$('#timerbar').classList.remove('done');$('#tbToggle').innerHTML=icon('pause',16,2.4);}paintTimer();}

/* AUDIO + VIBRATE + WAKELOCK */
var actx=null;
function resumeAudio(){try{if(!actx){var C=window.AudioContext||window.webkitAudioContext;if(C)actx=new C();}if(actx&&actx.state==='suspended')actx.resume();}catch(e){}}
function beep(freq,start,dur){var o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);o.type='sine';o.frequency.value=freq;var t=actx.currentTime+start;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.35,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.start(t);o.stop(t+dur+.02);}
function beepEnd(){if(!state.settings.sound)return;try{resumeAudio();if(!actx)return;beep(880,0,.18);beep(880,.22,.18);beep(1175,.44,.30);}catch(e){}}
function doVibrate(p){if(!state.settings.vibrate)return;try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}
var wakeLock=null;
function requestWake(){if(!state.settings.keepAwake)return;try{if('wakeLock'in navigator)navigator.wakeLock.request('screen').then(function(w){wakeLock=w;}).catch(function(){});}catch(e){}}
function releaseWake(){try{if(wakeLock){wakeLock.release();wakeLock=null;}}catch(e){}}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&state.activeWorkout&&state.settings.keepAwake)requestWake();});

document.addEventListener('click',function(e){
  resumeAudio();
  var tab=e.target.closest('[data-tab]');
  if(tab){state.ui.tab=tab.dataset.tab;state.ui.forcePicker=false;save();render();window.scrollTo(0,0);return;}
  var a=e.target.closest('[data-action]');if(!a)return;
  var act=a.dataset.action;
  if(act==='step'){
    var row=a.closest('.set-row'),card=a.closest('.ex-card'),exId=card.dataset.ex,i=+row.dataset.set,f=a.dataset.field,step=+a.dataset.step;
    var inp=row.querySelector('.val[data-field="'+f+'"]');var v=num(inp.value)+step;if(v<0)v=0;if(f!=='w')v=Math.round(v);v=+v.toFixed(2);
    inp.value=(v===0&&f==='w')?'':String(v);
    if(state.activeWorkout&&state.activeWorkout.logs[exId])state.activeWorkout.logs[exId][i][f]=inp.value;saveSoon();return;
  }
  if(act==='toggle-set'){
    var row2=a.closest('.set-row'),card2=a.closest('.ex-card'),exId2=card2.dataset.ex,i2=+row2.dataset.set;
    var s=state.activeWorkout.logs[exId2][i2];
    ['w','r','rir'].forEach(function(f2){var el=row2.querySelector('.val[data-field="'+f2+'"]');if(el)s[f2]=el.value;});
    s.done=!s.done;save();
    if(s.done){var ex2=EXMAP[exId2];startTimer(ex2.rest,ex2.name);}
    render();return;
  }
  if(act==='add-set'){if(!state.activeWorkout)return;var exId3=a.closest('.ex-card').dataset.ex,arr=state.activeWorkout.logs[exId3];var last=arr[arr.length-1]||{w:'',r:''};arr.push({w:last.w||'',r:'',rir:'',done:false});save();render();return;}
  if(act==='start-session'){startWorkout(a.dataset.session);return;}
  if(act==='resume'){state.ui.forcePicker=false;save();render();window.scrollTo(0,0);return;}
  if(act==='show-picker'){state.ui.forcePicker=true;render();window.scrollTo(0,0);return;}
  if(act==='finish'){finishWorkout();return;}
  if(act==='cancel-workout'){confirmModal('Abandonner la séance en cours ? Les séries cochées ne seront pas enregistrées.','do-cancel');return;}
  if(act==='do-cancel'){closeModal();cancelWorkout();return;}
  if(act==='toggle-prog'){var id='p_'+a.dataset.ex;state.ui.openEx=(state.ui.openEx===id)?null:id;render();return;}
  if(act==='t-minus'){bumpTimer(-15);return;}
  if(act==='t-plus'){bumpTimer(15);return;}
  if(act==='t-toggle'){toggleTimer();return;}
  if(act==='t-skip'){hideTimer();return;}
  if(act==='toggle-setting'){var k=a.dataset.key;state.settings[k]=!state.settings[k];save();if(k==='keepAwake'){state.settings[k]&&state.activeWorkout?requestWake():releaseWake();}render();return;}
  if(act==='export'){doExport();return;}
  if(act==='import'){$('#importFile').click();return;}
  if(act==='reset-block'){confirmModal('Recommencer le bloc : repasse en Semaine 1 (l’historique est conservé).','do-reset-block');return;}
  if(act==='do-reset-block'){state.settings.week=1;state.settings.startDate=todayISO();save();closeModal();render();return;}
  if(act==='clear-history'){confirmModal('Effacer TOUT l’historique de tes séances ? Irréversible.','do-clear-history');return;}
  if(act==='do-clear-history'){state.history=[];save();closeModal();render();return;}
  if(act==='reset-app'){confirmModal('Tout réinitialiser (historique + réglages + séance en cours) ?','do-reset-app');return;}
  if(act==='do-reset-app'){state=defState();save();closeModal();render();return;}
  if(act==='go-progress'){closeModal();state.ui.tab='progress';save();render();window.scrollTo(0,0);return;}
  if(act==='close-modal'){closeModal();return;}
  return;
});
/* seg buttons (semaine / objectif) */
document.addEventListener('click',function(e){
  var wb=e.target.closest('[data-week]');
  if(wb){state.settings.week=+wb.dataset.week;if(state.activeWorkout)state.activeWorkout.week=+wb.dataset.week;save();render();return;}
  var gb=e.target.closest('[data-goal]');
  if(gb){state.settings.goal=+gb.dataset.goal;save();render();return;}
});
$('#modal-root').addEventListener('click',function(e){if(e.target.id==='modal-root')closeModal();});

$('#importFile').addEventListener('change',function(e){
  var f=e.target.files[0];if(!f)return;var rd=new FileReader();
  rd.onload=function(){try{var d=JSON.parse(rd.result);if(d&&d.history&&d.settings){state=Object.assign(defState(),d);state.ui={tab:'progress',forcePicker:false,openEx:null,notes:{}};if(!state.settings.goal)state.settings.goal=3;save();render();modal('<h3>Importé ✅</h3><p class="muted">'+state.history.length+' séances restaurées.</p><button class="btn btn-primary btn-block" data-action="close-modal">OK</button>');}else throw 0;}catch(err){alert('Fichier invalide.');}};
  rd.readAsText(f);e.target.value='';
});
function doExport(){
  var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='muscu-sauvegarde-'+todayISO()+'.json';document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(url);a.remove();},100);
}

/* live duration ticker */
setInterval(function(){if(state.activeWorkout&&state.ui.tab==='workout'&&!state.ui.forcePicker){var el=$('#liveDur');if(el)el.textContent=fmtTime((Date.now()-state.activeWorkout.startedAt)/1000);}},1000);

/* ============ INIT ============ */
load();
$('#brandMark').innerHTML=icon('dumbbell',19,2.2);
Array.prototype.forEach.call(document.querySelectorAll('.ic-wrap'),function(el){el.innerHTML=icon(el.dataset.ic,21,2);});
$('#tbToggle').innerHTML=icon('pause',16,2.4);
render();
if(state.activeWorkout)requestWake();
})();
</script>
</body>
</html>
